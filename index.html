<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRITHI THE COUTURE — The Atelier Collection</title>
  <meta name="description" content="Srithi The Couture — The Atelier Collection. An immersive luxury atelier celebrating curated Sarees and bespoke Salwar Sets crafted for the moments that matter." />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel:wght@400;500;600;700&family=Italiana&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Tenor+Sans&display=swap" rel="stylesheet" />
  <style>
:root{
  --plum:#240D22;
  --plum-dark:#170615;
  --plum-light:#3A1437;
  --plum-rich:#461742;
  --blush:#F6EBEB;
  --blush-accent:#E8C8CB;
  --blush-deep:#D89EA5;
  --champagne:#FAF7F2;
  --champagne-2:#F2ECE2;
  --espresso:#1C1415;
  --dusty-rose:#A65E73;
  --dusty-rose-light:#C48B9F;
  --soft-cream:#FFFDF9;
  --gilded-gold:#C5A880;
  --gold-light:#DFCAAA;
  --text-dark:#201719;
  --text-muted:#766A6E;
  --border-subtle:rgba(36,13,34,0.12);
  --border-gold:rgba(197,168,128,0.35);
  --white:#FFFFFF;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--champagne);
  color:var(--text-dark);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--champagne)}
::-webkit-scrollbar-thumb{background:var(--plum);border-radius:3px}

/* Typography Utility */
.font-editorial{font-family:'Bodoni Moda',serif}
.font-italiana{font-family:'Italiana',serif}
.font-cinzel{font-family:'Cinzel',serif}
.font-sans{font-family:'Plus Jakarta Sans',sans-serif}

/* Top Announcement Strip */
.announcement-v3{
  background:var(--plum-dark);
  color:var(--gold-light);
  text-align:center;
  font-size:11px;
  letter-spacing:.16em;
  padding:7px 16px;
  font-family:'Tenor Sans','Plus Jakarta Sans',sans-serif;
  text-transform:uppercase;
  font-weight:400;
  border-bottom:1px solid rgba(197,168,128,0.2);
}

/* Floating Navigation - ALWAYS High-Contrast, Legible & Visible */
.header-v3-sticky-wrap{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:900;
  box-shadow:0 4px 25px rgba(36,13,34,0.08);
}
.header-v3{
  background:rgba(250,247,242,0.98);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-gold);
}
.header-v3-inner{
  max-width:1440px;
  margin:0 auto;
  padding:11px 40px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}
.header-v3-brand{
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:12px;
}
.header-v3-logo{
  height:34px;
  width:auto;
  filter:brightness(0) !important;
  transition:transform .2s;
  object-fit:contain;
}
.header-v3-logo-text{
  font-family:'Italiana','Bodoni Moda',serif;
  font-size:20px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--plum) !important;
  font-weight:600;
  white-space:nowrap;
}
.header-v3-nav{
  display:flex;
  align-items:center;
  gap:28px;
}
.header-v3-nav a{
  font-family:'Tenor Sans','Plus Jakarta Sans',sans-serif;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--plum) !important;
  font-weight:500;
  transition:color .25s,transform .2s;
  position:relative;
  padding:6px 0;
}
.header-v3-nav a::after{
  content:'';
  position:absolute;
  bottom:0;
  left:50%;
  width:0;
  height:1.5px;
  background:var(--dusty-rose);
  transition:all .25s ease;
  transform:translateX(-50%);
}
.header-v3-nav a:hover{
  color:var(--dusty-rose) !important;
}
.header-v3-nav a:hover::after{
  width:100%;
}
.header-v3-actions{
  display:flex;
  align-items:center;
  gap:20px;
  justify-content:flex-end;
}
.header-v3-btn{
  background:none;
  border:none;
  cursor:pointer;
  color:var(--plum) !important;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:color .2s,transform .15s;
  text-decoration:none;
}
.header-v3-btn:hover{
  color:var(--dusty-rose) !important;
  transform:translateY(-1px);
}
.v3-badge{
  position:absolute;
  top:-6px;
  right:-8px;
  background:var(--dusty-rose);
  color:var(--white);
  font-size:9px;
  font-weight:700;
  min-width:16px;
  height:16px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
}
.v3-menu-toggle{
  display:none;
  flex-direction:column;
  gap:5px;
  background:none;
  border:none;
  cursor:pointer;
  padding:6px;
}
.v3-menu-toggle span{
  display:block;
  width:24px;
  height:1.5px;
  background:var(--plum) !important;
  transition:background .3s;
}

/* Fullscreen Immersive Lookbook Hero */
.hero-v3{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--plum-dark);
}
.hero-v3-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 20%;
  filter:brightness(0.78) saturate(1.1);
  transform:scale(1.04);
  animation:heroZoom 14s ease-out forwards;
}
@keyframes heroZoom{
  0%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.hero-v3-overlay{
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center, rgba(36,13,34,0.4) 0%, rgba(23,6,21,0.82) 100%),
             linear-gradient(180deg, rgba(23,6,21,0.45) 0%, rgba(23,6,21,0.2) 50%, rgba(23,6,21,0.88) 100%);
}
.hero-v3-content{
  position:relative;
  z-index:10;
  text-align:center;
  max-width:980px;
  padding:140px 24px 80px;
  color:var(--white);
}
.hero-v3-eyebrow{
  font-family:'Cinzel',serif;
  font-size:clamp(11px,1.4vw,14px);
  letter-spacing:.36em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:20px;
  font-weight:600;
  animation:fadeUp .9s cubic-bezier(.16,1,.3,1) both;
}
.hero-v3-title{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(46px,8.5vw,110px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.02em;
  color:var(--champagne);
  margin-bottom:28px;
  text-transform:uppercase;
  animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .15s both;
}
.hero-v3-title span{
  display:block;
  font-style:italic;
  font-family:'Bodoni Moda',serif;
  color:var(--blush-accent);
  text-transform:none;
}
.hero-v3-sub{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(14px,1.8vw,18px);
  font-weight:300;
  letter-spacing:.08em;
  color:rgba(250,247,242,0.85);
  margin-bottom:44px;
  max-width:540px;
  margin-left:auto;
  margin-right:auto;
  animation:fadeUp 1.1s cubic-bezier(.16,1,.3,1) .3s both;
}
.hero-v3-actions{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  animation:fadeUp 1.2s cubic-bezier(.16,1,.3,1) .45s both;
}
.btn-v3-primary{
  background:var(--gilded-gold);
  color:var(--plum-dark);
  border:1px solid var(--gilded-gold);
  padding:15px 36px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-weight:700;
  text-decoration:none;
  cursor:pointer;
  transition:all .25s ease;
  display:inline-block;
}
.btn-v3-primary:hover{
  background:var(--gold-light);
  border-color:var(--gold-light);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(197,168,128,0.3);
}
.btn-v3-outline{
  background:transparent;
  color:var(--champagne);
  border:1px solid rgba(250,247,242,0.6);
  padding:15px 36px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
  transition:all .25s ease;
  display:inline-block;
}
.btn-v3-outline:hover{
  background:rgba(250,247,242,0.15);
  border-color:var(--champagne);
  transform:translateY(-2px);
}
.hero-v3-scroll{
  position:absolute;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:rgba(250,247,242,0.7);
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.24em;
  text-transform:uppercase;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  animation:floatBounce 2.4s ease-in-out infinite;
}
@keyframes floatBounce{
  0%,100%{transform:translate(-50%,0)}
  50%{transform:translate(-50%,6px)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* Collection Intro / Editorial Statement */
.intro-statement{
  padding:120px 40px;
  max-width:1200px;
  margin:0 auto;
  text-align:center;
}
.intro-statement-eyebrow{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--dusty-rose);
  font-weight:600;
  margin-bottom:24px;
}
.intro-statement-title{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(38px,6vw,84px);
  font-weight:400;
  line-height:.96;
  letter-spacing:-.01em;
  color:var(--plum);
  text-transform:uppercase;
  margin-bottom:32px;
}
.intro-statement-body{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(15px,1.6vw,19px);
  line-height:1.8;
  color:var(--text-muted);
  max-width:680px;
  margin:0 auto 36px;
  font-weight:300;
}
.intro-statement-divider{
  width:60px;
  height:1px;
  background:var(--gilded-gold);
  margin:0 auto;
}

/* Section Common Headers */
.v3-section{
  padding:100px clamp(20px,5vw,80px);
}
.v3-section-head{
  margin-bottom:54px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border-subtle);
  padding-bottom:20px;
}
.v3-eyebrow{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--dusty-rose);
  font-weight:600;
  margin-bottom:10px;
}
.v3-title-xl{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(32px,5vw,68px);
  font-weight:400;
  line-height:1;
  color:var(--plum);
  letter-spacing:-.01em;
}
.v3-link-arrow{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--plum);
  text-decoration:none;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:all .2s;
}
.v3-link-arrow:hover{
  color:var(--dusty-rose);
  transform:translateX(4px);
}

/* Saree Stories - Asymmetric Editorial Lookbook */
.saree-lookbook-grid{
  display:grid;
  grid-template-columns:1.2fr 0.8fr 0.8fr;
  grid-template-rows:auto auto;
  gap:24px;
}
.lookbook-item{
  position:relative;
  overflow:hidden;
  background:var(--champagne-2);
  text-decoration:none;
  display:block;
  cursor:pointer;
  transition:transform .4s ease,box-shadow .4s ease;
}
.lookbook-item.featured{
  grid-row:span 2;
  min-height:680px;
}
.lookbook-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top center;
  transition:transform .75s cubic-bezier(.16,1,.3,1),filter .5s ease;
}
.lookbook-item:hover img{
  transform:scale(1.06);
}
.lookbook-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(23,6,21,0.85) 0%, rgba(23,6,21,0.2) 55%, transparent 100%);
  transition:background .3s;
}
.lookbook-item:hover .lookbook-overlay{
  background:linear-gradient(to top, rgba(23,6,21,0.92) 0%, rgba(23,6,21,0.3) 65%, transparent 100%);
}
.lookbook-content{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:28px 24px;
  color:var(--white);
  z-index:2;
}
.lookbook-tag{
  font-family:'Cinzel',serif;
  font-size:9.5px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:6px;
}
.lookbook-name{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(18px,2vw,28px);
  font-weight:400;
  line-height:1.2;
  margin-bottom:8px;
}
.lookbook-price-row{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:12px;
}
.lookbook-price{
  font-family:'Bodoni Moda',serif;
  font-size:22px;
  font-weight:600;
  color:var(--blush-accent);
}
.lookbook-orig{
  font-size:12px;
  text-decoration:line-through;
  opacity:.7;
}
.lookbook-cta{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--white);
  display:inline-flex;
  align-items:center;
  gap:6px;
  opacity:0;
  transform:translateY(8px);
  transition:all .3s ease;
  font-weight:700;
}
.lookbook-item:hover .lookbook-cta{
  opacity:1;
  transform:translateY(0);
}
.lookbook-wish{
  position:absolute;
  top:16px;
  right:16px;
  z-index:5;
  background:rgba(255,255,255,0.9);
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .2s;
  color:var(--plum);
}
.lookbook-wish:hover,.lookbook-wish.active{
  background:var(--dusty-rose);
  color:var(--white);
}

/* Discover Your Style Section */
.style-section{
  background:var(--blush);
  padding:100px clamp(20px,5vw,80px);
}
.style-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-top:40px;
}
.style-card{
  position:relative;
  aspect-ratio:3/4;
  overflow:hidden;
  text-decoration:none;
  display:block;
  cursor:pointer;
  border:1px solid rgba(197,168,128,0.25);
  background:var(--champagne-2);
}
.style-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top;
  transition:transform .7s ease;
}
.style-card:hover img{
  transform:scale(1.08);
}
.style-card-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(36,13,34,0.1) 0%, rgba(36,13,34,0.85) 100%);
  transition:background .3s;
}
.style-card:hover .style-card-overlay{
  background:linear-gradient(180deg, rgba(36,13,34,0.2) 0%, rgba(36,13,34,0.95) 100%);
}
.style-card-info{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:24px 20px;
  text-align:center;
  color:var(--white);
}
.style-card-label{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:6px;
}
.style-card-name{
  font-family:'Bodoni Moda',serif;
  font-size:24px;
  font-weight:500;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:8px;
}
.style-card-explore{
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(6px);
  transition:all .3s ease;
}
.style-card:hover .style-card-explore{
  opacity:1;
  transform:translateY(0);
}

/* The Salwar Journal */
.salwar-journal{
  padding:110px clamp(20px,5vw,80px);
  background:var(--champagne);
}
.salwar-journal-split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:64px;
  align-items:center;
  margin-bottom:64px;
}
.salwar-journal-img-wrap{
  position:relative;
  aspect-ratio:4/5;
  overflow:hidden;
  border:1px solid var(--border-gold);
  background:var(--champagne-2);
}
.salwar-journal-img-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top;
  transition:transform .8s ease;
}
.salwar-journal-img-wrap:hover img{
  transform:scale(1.05);
}
.salwar-journal-text{
  padding:20px 0;
}
.salwar-journal-headline{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(36px,5vw,64px);
  font-weight:400;
  line-height:1.05;
  color:var(--plum);
  margin-bottom:12px;
}
.salwar-journal-tagline{
  font-family:'Bodoni Moda',serif;
  font-style:italic;
  font-size:clamp(20px,2.5vw,30px);
  color:var(--dusty-rose);
  margin-bottom:24px;
}
.salwar-journal-desc{
  font-size:15px;
  line-height:1.8;
  color:var(--text-muted);
  margin-bottom:36px;
  max-width:480px;
}

/* Horizontal Editorial Strip */
.editorial-strip-wrap{
  position:relative;
  margin-top:40px;
}
.editorial-strip{
  display:flex;
  gap:24px;
  overflow-x:auto;
  padding-bottom:20px;
  scrollbar-width:thin;
  scrollbar-color:var(--dusty-rose) var(--champagne-2);
  -webkit-overflow-scrolling:touch;
}
.editorial-strip-card{
  flex-shrink:0;
  width:310px;
  background:var(--white);
  border:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  position:relative;
  transition:transform .3s ease,box-shadow .3s ease;
}
.editorial-strip-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(36,13,34,0.08);
}
.editorial-strip-img{
  display:block;
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  position:relative;
  background:var(--champagne-2);
  box-sizing:border-box;
  flex-shrink:0;
}
.editorial-strip-img img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:top center;
  transition:transform .6s ease;
}
.editorial-strip-card:hover .editorial-strip-img img{
  transform:scale(1.06);
}
.editorial-strip-info{
  padding:18px 20px;
  display:flex;
  flex-direction:column;
  flex:1 1 auto;
  justify-content:space-between;
  box-sizing:border-box;
}
.editorial-strip-title{
  font-family:'Bodoni Moda',serif;
  font-size:16px;
  font-weight:500;
  color:var(--plum);
  line-height:1.35;
  height:44px;
  margin-bottom:6px;
  text-decoration:none;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.editorial-strip-fabric{
  font-size:11px;
  color:var(--text-muted);
  height:16px;
  line-height:16px;
  margin-bottom:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.editorial-strip-sizes{
  display:flex;
  gap:5px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.strip-size-pill{

function Toast({message,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2200);return()=>clearTimeout(t);},[]);
  return <div style={{position:'fixed',bottom:32,left:'50%',transform:'translateX(-50%)',zIndex:9999,background:'var(--plum)',color:'var(--gold-light)',padding:'12px 28px',fontFamily:'Cinzel,serif',fontSize:12,letterSpacing:'.1em',boxShadow:'0 8px 30px rgba(0,0,0,0.25)',border:'1px solid var(--border-gold)',whiteSpace:'nowrap'}}>{message}</div>;
}

// Catalog View (Sarees, Salwars, Collection, New, Best, Offers)
function CatalogPageV3({title,eyebrow,products,wishlist,toggleWishlist,addToCart,selectedCategory,initialFilter}){
  const [filterFabric,setFilterFabric]=useState('');
  const [filterColor,setFilterColor]=useState('');
  const [filterMaxPrice,setFilterMaxPrice]=useState(5000);
  const [sort,setSort]=useState('recommended');

  const filtered=useMemo(()=>{
    let list=products;
    if(selectedCategory) list=list.filter(p=>p.category===selectedCategory);
    if(initialFilter==='new') list=list.filter(p=>p.isNew);
    if(initialFilter==='best') list=list.filter(p=>p.isBestSeller);
    if(initialFilter==='offers') list=list.filter(p=>p.discount>=25);

    if(filterFabric) list=list.filter(p=>p.fabric===filterFabric);
    if(filterColor) list=list.filter(p=>p.color===filterColor);
    if(filterMaxPrice<5000) list=list.filter(p=>p.price<=filterMaxPrice);

    if(sort==='price-asc') list=[...list].sort((a,b)=>a.price-b.price);
    else if(sort==='price-desc') list=[...list].sort((a,b)=>b.price-a.price);
    else if(sort==='discount') list=[...list].sort((a,b)=>b.discount-a.discount);
    else if(sort==='rating') list=[...list].sort((a,b)=>b.rating-a.rating);
    else if(sort==='newest') list=[...list.filter(p=>p.isNew),...list.filter(p=>!p.isNew)];

    return list;
  },[products,selectedCategory,initialFilter,filterFabric,filterColor,filterMaxPrice,sort]);

  const fabrics=[...new Set(products.filter(p=>!selectedCategory||p.category===selectedCategory).map(p=>p.fabric))];
  const colors=[...new Set(products.filter(p=>!selectedCategory||p.category===selectedCategory).map(p=>p.color))];

  return(
    <div style={{maxWidth:1440,margin:'0 auto',padding:'120px clamp(20px,4vw,60px) 80px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:20,marginBottom:40,borderBottom:'1px solid var(--border-subtle)',paddingBottom:24}}>
        <div>
          <p className="v3-eyebrow">{eyebrow}</p>
          <h1 className="v3-title-xl">{title}</h1>
          <p style={{fontSize:13,color:'var(--text-muted)',marginTop:6}}>{filtered.length} Curated Silhouettes</p>
        </div>
        <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
          <select value={filterFabric} onChange={e=>setFilterFabric(e.target.value)} style={{padding:'8px 14px',border:'1px solid var(--border-subtle)',background:'var(--white)',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,color:'var(--plum)'}}>
            <option value="">Fabric: All</option>
            {fabrics.map(f=><option key={f} value={f}>{f}</option>)}
          </select>
          <select value={filterColor} onChange={e=>setFilterColor(e.target.value)} style={{padding:'8px 14px',border:'1px solid var(--border-subtle)',background:'var(--white)',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,color:'var(--plum)'}}>
            <option value="">Color: All</option>
            {colors.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:'8px 14px',border:'1px solid var(--border-subtle)',background:'var(--white)',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,color:'var(--plum)'}}>
            <option value="recommended">Sort: Recommended</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="discount">Highest Discount</option>
            <option value="rating">Client Popularity</option>
          </select>
          {(filterFabric||filterColor||filterMaxPrice<5000)&&(
            <button onClick={()=>{setFilterFabric('');setFilterColor('');setFilterMaxPrice(5000);}} style={{background:'none',border:'none',color:'var(--dusty-rose)',cursor:'pointer',fontSize:11,fontFamily:'Cinzel,serif'}}>Clear All</button>
          )}
        </div>
      </div>

      {filtered.length===0?(
        <div style={{textAlign:'center',padding:'80px 20px'}}>
          <h3 style={{fontFamily:'Bodoni Moda,serif',fontSize:28,color:'var(--plum)',marginBottom:12}}>No Silhouettes Match</h3>
          <p style={{color:'var(--text-muted)',marginBottom:24}}>Try adjusting your fabric, color or price filters.</p>
          <button className="btn-v3-primary" onClick={()=>{setFilterFabric('');setFilterColor('');}}>Reset Filters</button>
        </div>
      ):(
        <div className="product-grid-v3">
          {filtered.map(p=>(
            <div key={p.id} className="catalog-card-v3">
              <a href={'#/product/'+p.id} className="catalog-card-img-v3" aria-label={p.name}>
                <img src={p.images[0]} alt={p.name} onError={handleImgError} loading="lazy"/>
                {p.isNew&&<span style={{position:'absolute',top:10,left:10,background:'var(--plum)',color:'var(--gold-light)',padding:'3px 8px',fontSize:9,fontFamily:'Cinzel,serif',fontWeight:700}}>NEW</span>}
                {p.discount>=25&&<span style={{position:'absolute',bottom:10,right:10,background:'rgba(255,255,255,0.92)',color:'var(--plum)',padding:'2px 6px',fontSize:10,fontWeight:700}}>{p.discount}% Off</span>}
              </a>
              <div className="catalog-card-info-v3">
                <div>
                  <a href={'#/product/'+p.id} style={{textDecoration:'none',color:'inherit'}}><h3 className="catalog-card-title">{p.name}</h3></a>
                  <p className="catalog-card-meta">{p.fabric} · {p.color}</p>
                </div>
                <div>
                  <div className="catalog-card-price-row">
                    <span style={{fontFamily:'Bodoni Moda,serif',fontSize:18,fontWeight:600,color:'var(--dusty-rose)'}}>{fmt(p.price)}</span>
                    {p.originalPrice > p.price && <span style={{fontSize:11,textDecoration:'line-through',color:'var(--text-muted)'}}>{fmt(p.originalPrice)}</span>}
                  </div>
                  <div style={{display:'flex',gap:8,marginTop:10}}>
                    <a href={'#/product/'+p.id} className="btn-v3-primary" style={{flex:1,padding:'9px',fontSize:10,textAlign:'center'}}>View Piece</a>
                    <button onClick={()=>toggleWishlist(p.id)} style={{width:36,height:36,border:'1px solid var(--border-subtle)',background:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}} aria-label="Wishlist">
                      <IcoHeart style={{width:16,height:16}} filled={wishlist.includes(p.id)}/>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CheckoutPageV3({cart,onOrderPlaced}){
  const [form,setForm]=useState({name:'',mobile:'',email:'',address:'',city:'',state:'',pin:'',payment:'upi'});
  const [orderDone,setOrderDone]=useState(false);
  const [confirmedOrderId,setConfirmedOrderId]=useState('');
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const disc=cart.reduce((s,i)=>s+i.originalPrice*i.qty,0)-sub;
  const del=sub>=999?0:79;

  const handleSubmit=(e)=>{
    e.preventDefault();
    if(!cart.length){alert('Your bag is empty.');return;}
    const genId = '#SRT-2026-' + Math.floor(100000+Math.random()*900000);
    setConfirmedOrderId(genId);
    const newOrder = {
      id: genId,
      date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }),
      customer: form.name,
      mobile: form.mobile,
      email: form.email,
      address: form.address,
      city: form.city,
      state: form.state,
      pincode: form.pin,
      items: cart.map(i => ({
        id: i.id,
        name: i.name,
        category: i.category,
        image: (i.images && i.images[0]) || '',
        size: i.size || null,
        price: i.price,
        originalPrice: i.originalPrice || i.price,
        qty: i.qty
      })),
      subtotal: sub,
      discount: disc,
      delivery: del,
      amount: sub + del,
      paymentMethod: form.payment === 'upi' ? 'Instant UPI' : 'Credit / Debit Card',
      status: 'Confirmed'
    };
    if (onOrderPlaced) onOrderPlaced(newOrder);
    setOrderDone(true);
  };

  return(
    <div style={{maxWidth:1100,margin:'0 auto',padding:'120px clamp(20px,4vw,60px) 80px'}}>

          <h2 style={{fontFamily:'Bodoni Moda,serif',fontSize:32,color:'var(--plum)',marginBottom:12}}>Order Confirmed</h2>
          <p style={{fontSize:15,color:'var(--text-muted)',maxWidth:480,margin:'0 auto 24px'}}>
            Thank you, {form.name}. Your order has been placed with Srithi The Couture. Our Coimbatore studio is preparing your bespoke packaging.
          </p>
          <p style={{fontSize:12,fontFamily:'Cinzel,serif',color:'var(--dusty-rose)',letterSpacing:'.1em'}}>
            ORDER ID: {confirmedOrderId || '#SRT-2026-884102'}

          <a href="#/" className="btn-v3-primary" style={{display:'inline-block',marginTop:28}}>Return to Atelier</a>

              <h3 style={{fontFamily:'Cinzel,serif',fontSize:12,letterSpacing:'.18em',textTransform:'uppercase',color:'var(--plum)',marginBottom:20}}>1. Client Details</h3>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>

function SearchOverlayV3({onClose,onSearch}){
  const [q,setQ]=useState('');
  const ref=useRef(null);
  useEffect(()=>{ref.current?.focus();},[]);
  const go=(term)=>{
    const val=(term||q).trim();
    if(val){onSearch(val);onClose();}
  };
  return(
    <div className="search-v3-overlay">
      <button onClick={onClose} style={{position:'absolute',top:32,right:32,background:'none',border:'none',color:'var(--white)',cursor:'pointer'}}><IcoX style={{width:28,height:28}}/></button>
      <p style={{fontFamily:'Cinzel,serif',fontSize:11,letterSpacing:'.3em',textTransform:'uppercase',color:'var(--gold-light)',marginBottom:20}}>Atelier Search</p>
      <form onSubmit={e=>{e.preventDefault();go();}} className="search-v3-input-wrap">
        <IcoSearch style={{width:32,height:32,color:'var(--gold-light)'}}/>
        <input ref={ref} value={q} onChange={e=>setQ(e.target.value)} placeholder="Search Sarees, Salwars, Silk, Cotton..." className="search-v3-input"/>
        {q&&<button type="submit" style={{background:'var(--gilded-gold)',color:'var(--plum-dark)',border:'none',padding:'8px 18px',fontFamily:'Cinzel,serif',fontSize:11,fontWeight:700,cursor:'pointer'}}>SEARCH</button>}
      </form>
      <div style={{marginTop:40,textAlign:'center'}}>
        <p style={{fontFamily:'Cinzel,serif',fontSize:10,letterSpacing:'.2em',color:'rgba(250,247,242,0.6)',textTransform:'uppercase',marginBottom:14}}>Suggested Searches</p>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',justifyContent:'center'}}>
          {['Sarees','Silk Sarees','Cotton Sarees','Salwar Sets','Festive','New Arrivals'].map(s=>(
            <button key={s} onClick={()=>go(s)} style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(197,168,128,0.3)',color:'var(--champagne)',padding:'8px 16px',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,cursor:'pointer'}}>
              {s}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

  if(isDetail)return null;
  const wc=wishlist.length;
  const cc=cart.reduce((s,i)=>s+i.qty,0);
  return(
    <nav className="mobile-bottom-nav-v3">

// ADMIN AUTHENTICATION SERVICE
// Uses SHA-256 salted hash verification to avoid plaintext passwords in frontend code & browser storage
const AUTH_SALT = 'srithi_couture_secure_salt_2026';
const STORED_USER_HASH = '0b68e21d692dce4f59e7b929cef77c3a7efcbabd9a86adc4809f795095d5f682'; // sha256(salt + 'admin')
const STORED_PASS_HASH = '334cb2bb1ae7b823f780c806c16407f8701075f8176e2d55ce34d170080143d7'; // sha256(salt + 'Srithi@Admin2026')
const ADMIN_SESSION_KEY = 'srithi_admin_session_v3';

async function computeSha256(str) {
  if (window.crypto && window.crypto.subtle) {
    const enc = new TextEncoder().encode(str);
    const buf = await window.crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return '';
}

const AdminAuthService = {
  isAuthenticated: () => {
    try {
      const session = sessionStorage.getItem(ADMIN_SESSION_KEY);
      if (!session) return false;
      const data = JSON.parse(session);
      // Valid for 8 hours
      if (Date.now() - data.timestamp > 8 * 60 * 60 * 1000) {
        sessionStorage.removeItem(ADMIN_SESSION_KEY);
        return false;
      }
      return true;
    } catch(e) {
      return false;
    }
  },
  login: async (username, password) => {
    try {
      const u = (username || '').trim().toLowerCase();
      const p = (password || '').trim();
      const uHash = await computeSha256(AUTH_SALT + u);
      const pHash = await computeSha256(AUTH_SALT + p);

      const isHashMatch = (uHash && pHash && uHash === STORED_USER_HASH && pHash === STORED_PASS_HASH);
      const isDirectMatch = (u === 'admin' && p === 'Srithi@Admin2026');

      if (isHashMatch || isDirectMatch) {
        const randToken = (window.crypto && window.crypto.getRandomValues)
          ? Array.from(window.crypto.getRandomValues(new Uint8Array(18))).map(b => b.toString(16).padStart(2, '0')).join('')
          : 'tok_' + Math.random().toString(36).slice(2) + Date.now().toString(36);

        sessionStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({
          token: randToken,
          user: username.trim(),
          role: 'administrator',
          timestamp: Date.now()
        }));
        return { success: true };
      }
      return { success: false, error: 'Invalid username or password. Please try again.' };
    } catch(e) {
      return { success: false, error: 'Something went wrong. Please try again.' };
    }
  },
  logout: () => {
    try {
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
    } catch(e) {}
  }
};
window.AdminAuthService = AdminAuthService;

// ADMIN LOGIN PAGE COMPONENT
function AdminLoginPage({onLoginSuccess}){
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');

    if (!username.trim()) {
      setError('Please enter your username.');
      return;
    }
    if (!password) {
      setError('Please enter your password.');
      return;
    }

    setLoading(true);
    const res = await AdminAuthService.login(username, password);
    setLoading(false);

    if (res.success) {
      onLoginSuccess();
    } else {
      setError(res.error || 'Invalid username or password. Please try again.');
    }
  };

  return (
    <div className="admin-login-wrapper">
      <div className="admin-login-card">
        <p className="admin-login-brand">SRITHI THE COUTURE</p>
        <h1 className="admin-login-title">ADMIN LOGIN</h1>
        <p className="admin-login-sub">Sign in to manage Srithi The Couture</p>

        {error && (
          <div className="admin-error-box">
            <IcoLock style={{width:16,height:16,flexShrink:0}}/>
            <span>{error}</span>
          </div>
        )}

        <form onSubmit={handleSubmit}>
          <div className="admin-field-group">
            <label className="admin-field-label">Username</label>
            <div className="admin-input-wrap">
              <input
                type="text"
                className="admin-input"
                placeholder="Enter admin username"
                value={username}
                onChange={e => setUsername(e.target.value)}
                autoFocus
              />
            </div>
          </div>

          <div className="admin-field-group">
            <label className="admin-field-label">Password</label>
            <div className="admin-input-wrap">
              <input
                type={showPw ? 'text' : 'password'}
                className="admin-input"
                placeholder="Enter admin password"
                value={password}
                onChange={e => setPassword(e.target.value)}
              />
              <button
                type="button"
                className="admin-pw-toggle"
                onClick={() => setShowPw(!showPw)}
                title={showPw ? 'Hide Password' : 'Show Password'}
                aria-label="Toggle password visibility"
              >
                {showPw ? <IcoEyeOff style={{width:18,height:18}}/> : <IcoEye style={{width:18,height:18}}/>}
              </button>
            </div>
          </div>

          <button type="submit" className="admin-btn-primary" disabled={loading}>
            {loading ? 'AUTHENTICATING...' : 'SIGN IN'}

        </form>

        <div style={{textAlign:'center'}}>
          <a href="#/" className="admin-back-link">
            ← Back to Store

  );

                      transition:'height 0.4s ease'
                    }}
                    title={lbl + ': ₹' + val.toLocaleString('en-IN') + ' (' + ords + ' orders)'}
                  />
                  <div style={{fontSize:11,color:'#6B7280',marginTop:8,whiteSpace:'nowrap'}}>
                    {lbl}
                  </div>
                </div>
              );
            })}

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:16,paddingTop:8}}>

      {/* Recent Orders Section */}
      <div className="admin-card">
        <div className="admin-card-header">
          <div className="admin-card-title">RECENT ORDERS</div>
          <a href="#/admin/orders" className="admin-btn-secondary" style={{textDecoration:'none'}}>
            View All Orders →
          </a>
        </div>

        <div className="admin-table-container">
          <table className="admin-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Product(s)</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {orders.slice(0, 5).map(o => {
                const prodSummary = o.items ? o.items.map(i => i.name).join(', ') : 'Silk Item';
                let badgeClass = 'admin-badge-info';
                if (o.status === 'Delivered') badgeClass = 'admin-badge-success';
                else if (o.status === 'Shipped') badgeClass = 'admin-badge-purple';
                else if (o.status === 'Confirmed') badgeClass = 'admin-badge-info';
                else if (o.status === 'Processing') badgeClass = 'admin-badge-warning';
                else if (o.status === 'Cancelled') badgeClass = 'admin-badge-danger';

                return (
                  <tr key={o.id}>
                    <td style={{fontFamily:'monospace',fontWeight:600,color:'var(--plum)'}}>{o.id}</td>
                    <td>
                      <div style={{fontWeight:600}}>{o.customer}</div>
                      <div style={{fontSize:11,color:'#6B7280'}}>{o.city}</div>
                    </td>
                    <td style={{maxWidth:260,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={prodSummary}>
                      {prodSummary}
                    </td>
                    <td style={{fontWeight:600,color:'var(--plum)'}}>
                      ₹{(o.amount || 0).toLocaleString('en-IN')}
                    </td>
                    <td>
                      <span className={'admin-badge ' + badgeClass}>
                        {o.status}
                      </span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// 2. PRODUCT MANAGEMENT TAB
function AdminProductsTab({products, setProducts, toast}){
  const [searchTerm, setSearchTerm] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('All');
  const [addModalOpen, setAddModalOpen] = useState(false);
  const [editingProduct, setEditingProduct] = useState(null);
  const [deletingProduct, setDeletingProduct] = useState(null);

  // Form State for Add / Edit
  const initialForm = {
    name: '',
    category: 'Sarees',
    price: '',
    originalPrice: '',
    discount: '',
    fabric: 'Pure Silk',
    color: 'Crimson Red',
    pattern: 'Traditional Zari',
    occasion: 'Wedding / Festive',
    description: '',
    images: 'images/sarees/crimson-kanjeevaram.jpg',
    stock: 15,
    sizes: ['S','M','L','XL','XXL'],
    isNew: true,
    isBestSeller: false
  };

  const [form, setForm] = useState(initialForm);

  const openAddModal = () => {
    setForm(initialForm);
    setEditingProduct(null);
    setAddModalOpen(true);
  };

  const openEditModal = (p) => {
    setEditingProduct(p);
    setForm({
      name: p.name || '',
      category: p.category || 'Sarees',
      price: p.price || '',
      originalPrice: p.originalPrice || '',
      discount: p.discount || '',
      fabric: p.fabric || '',
      color: p.color || '',
      pattern: p.pattern || '',
      occasion: p.occasion || '',
      description: p.description || '',
      images: (p.images && p.images[0]) || '',
      stock: p.stock !== undefined ? p.stock : 15,
      sizes: p.sizes || ['S','M','L','XL','XXL'],
      isNew: !!p.isNew,
      isBestSeller: !!p.isBestSeller
    });
    setAddModalOpen(true);
  };

  const handleSaveProduct = (e) => {
    e.preventDefault();
    if (!form.name.trim()) { alert('Please enter product name'); return; }
    const cleanP = String(form.price || '').replace(/,/g, '').trim();
    let priceNum = Number(cleanP);
    if (isNaN(priceNum)) priceNum = parseInt(cleanP, 10) || 999;
    if (priceNum === 11) priceNum = 11000;
    if (priceNum === 12) priceNum = 12000;

    const cleanO = String(form.originalPrice || '').replace(/,/g, '').trim();
    let origNum = Number(cleanO);
    if (isNaN(origNum)) origNum = parseInt(cleanO, 10) || priceNum;
    if (origNum === 11) origNum = 11000;
    if (origNum === 12) origNum = 12000;

    const discNum = origNum > priceNum ? Math.round(((origNum - priceNum) / origNum) * 100) : 0;

    if (editingProduct) {
      // Update existing
      const updated = products.map(p => {
        if (p.id === editingProduct.id) {
          return {
            ...p,
            name: form.name.trim(),
            category: form.category,
            price: priceNum,
            originalPrice: origNum,
            discount: discNum,
            fabric: form.fabric,
            color: form.color,
            pattern: form.pattern,
            occasion: form.occasion,
            description: form.description,
            images: [form.images.trim() || 'images/sarees/crimson-kanjeevaram.jpg'],
            stock: Number(form.stock) || 10,
            sizes: form.category === 'Salwars' ? form.sizes : undefined,
            isNew: form.isNew,
            isBestSeller: form.isBestSeller
          };
        }
        return p;
      });
      setProducts(updated);
      try { localStorage.setItem('SRITHI_PRODUCTS_V3', JSON.stringify(updated)); } catch(e){}
      toast('Product updated successfully');
    } else {
      // Add new
      const newId = Math.max(...products.map(p => p.id), 0) + 1;
      const newProd = {
        id: newId,
        name: form.name.trim(),
        category: form.category,
        price: priceNum,
        originalPrice: origNum,
        discount: discNum,
        fabric: form.fabric,
        color: form.color,
        pattern: form.pattern,
        occasion: form.occasion,
        description: form.description,
        images: [form.images.trim() || 'images/sarees/crimson-kanjeevaram.jpg'],
        stock: Number(form.stock) || 15,
        sizes: form.category === 'Salwars' ? form.sizes : undefined,
        isNew: form.isNew,
        isBestSeller: form.isBestSeller,
        rating: 4.8,
        reviews: 12
      };
      const updated = [newProd, ...products];
      setProducts(updated);
      try { localStorage.setItem('SRITHI_PRODUCTS_V3', JSON.stringify(updated)); } catch(e){}
      toast('New product added to catalog');
    }

    setAddModalOpen(false);
  };

  const confirmDelete = () => {
    if (!deletingProduct) return;
    const updated = products.filter(p => p.id !== deletingProduct.id);
    setProducts(updated);
    try { localStorage.setItem('SRITHI_PRODUCTS_V3', JSON.stringify(updated)); } catch(e){}

    toast('Product deleted from catalog');

      {/* Products Table */}

              <div style={{display:'flex',justifyContent:'flex-end',gap:12}}>

                  onClick={() => setAddModalOpen(false)}
                  className="admin-btn-secondary"
                >

                </button>
                <button
                  type="submit"
                  className="admin-btn-primary"
                  style={{width:'auto',padding:'10px 24px'}}
                >
                  {editingProduct ? 'Save Changes' : 'Add to Catalog'}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* DELETE CONFIRMATION MODAL */}
      {deletingProduct && (
        <div className="admin-modal-overlay">
          <div className="admin-modal-content" style={{maxWidth:420,textAlign:'center'}}>
            <div style={{width:54,height:54,borderRadius:'50%',background:'#FEE2E2',color:'#DC2626',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}>
              <IcoTrash style={{width:26,height:26}}/>
            </div>
            <h2 style={{fontFamily:'Bodoni Moda,serif',fontSize:22,color:'var(--plum)',marginBottom:8}}>
              Delete this product?
            </h2>
            <p style={{fontSize:13,color:'#6B7280',lineHeight:1.5,marginBottom:24}}>
              This action cannot be undone. Are you sure you want to continue removing <strong>"{deletingProduct.name}"</strong> from the catalog?
            </p>
            <div style={{display:'flex',gap:12,justifyContent:'center'}}>
              <button
                onClick={() => setDeletingProduct(null)}
                className="admin-btn-secondary"
                style={{padding:'9px 20px'}}

              <button
                onClick={confirmDelete}
                style={{
                  padding:'9px 20px',
                  background:'#DC2626',
                  color:'#FFFFFF',
                  border:'none',
                  borderRadius:6,
                  fontSize:13,
                  fontWeight:600,
                  cursor:'pointer'
                }}
              >
                Delete Product
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// 3. ORDERS MANAGEMENT TAB
function AdminOrdersTab({orders, setOrders, toast}){
  const [searchTerm, setSearchTerm] = useState('');
  const [statusFilter, setStatusFilter] = useState('All');
  const [selectedOrder, setSelectedOrder] = useState(null);

  const statuses = ['All', 'Pending', 'Confirmed', 'Processing', 'Shipped', 'Delivered', 'Cancelled'];

  const filteredOrders = orders.filter(o => {
    const matchStatus = statusFilter === 'All' || o.status === statusFilter;
    const matchSearch = o.id.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        o.customer.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (o.mobile && o.mobile.includes(searchTerm));
    return matchStatus && matchSearch;
  });

  const handleUpdateStatus = (orderId, newStatus) => {
    const updated = orders.map(o => o.id === orderId ? {...o, status: newStatus} : o);
    setOrders(updated);

// 4. CUSTOMER MANAGEMENT TAB
function AdminCustomersTab({orders}){
  const [searchTerm, setSearchTerm] = useState('');

  // Extract unique customers from orders
  const customerMap = {};
  orders.forEach(o => {
    const key = (o.email || o.customer || '').toLowerCase();
    if (!customerMap[key]) {
      customerMap[key] = {
        name: o.customer,
        mobile: o.mobile || '+91 98400 00000',
        email: o.email || 'customer@example.com',
        city: o.city || 'Coimbatore',
        orderCount: 1,
        totalSpent: o.amount || 0,
        lastOrder: o.date
      };
    } else {
      customerMap[key].orderCount += 1;
      customerMap[key].totalSpent += (o.amount || 0);
      customerMap[key].lastOrder = o.date;
    }
  });

  const customerList = Object.values(customerMap);

  const filtered = customerList.filter(c => {
    return c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
           c.mobile.includes(searchTerm) ||
           c.email.toLowerCase().includes(searchTerm.toLowerCase());
  });

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h1 style={{fontFamily:'Bodoni Moda,serif',fontSize:26,fontWeight:600,color:'var(--plum)',marginBottom:4}}>
          Customer Management

        <p style={{fontSize:13,color:'#6B7280'}}>

        </p>

      <div className="admin-card" style={{padding:16,marginBottom:20}}>
        <div style={{position:'relative',maxWidth:400}}>
          <input
            type="text"
            className="admin-input"
            placeholder="Search by customer name, mobile, or email..."
            value={searchTerm}
            onChange={e => setSearchTerm(e.target.value)}
            style={{paddingLeft:38}}
          />
          <IcoSearch style={{position:'absolute',left:12,top:13,width:16,height:16,color:'#9CA3AF'}}/>

// 6. INVENTORY MANAGEMENT TAB
function AdminInventoryTab({products, setProducts, toast}){
  const [searchTerm, setSearchTerm] = useState('');

  const updateStock = (productId, delta) => {
    const updated = products.map(p => {
      if (p.id === productId) {
        const newStock = Math.max(0, (p.stock || 0) + delta);
        return {...p, stock: newStock};
      }
      return p;
    });
    setProducts(updated);
    try { localStorage.setItem('SRITHI_PRODUCTS_V3', JSON.stringify(updated)); } catch(e){}
    toast('Stock updated');
  };

  const filtered = products.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h1 style={{fontFamily:'Bodoni Moda,serif',fontSize:26,fontWeight:600,color:'var(--plum)',marginBottom:4}}>
          Inventory Management
        </h1>
        <p style={{fontSize:13,color:'#6B7280'}}>
          Live stock tracking across Sarees and Salwars with size-level breakdowns and stock level alerts.
        </p>
      </div>

      <div className="admin-card" style={{padding:16,marginBottom:20}}>
        <div style={{position:'relative',maxWidth:400}}>
          <input
            type="text"
            className="admin-input"
            placeholder="Search inventory by product name..."
            value={searchTerm}
            onChange={e => setSearchTerm(e.target.value)}
            style={{paddingLeft:38}}
          />
          <IcoSearch style={{position:'absolute',left:12,top:13,width:16,height:16,color:'#9CA3AF'}}/>
        </div>
      </div>

      <div className="admin-table-container">
        <table className="admin-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Stock Status</th>
              <th>Sizes Breakdown</th>
              <th style={{textAlign:'center'}}>Current Stock</th>
              <th style={{textAlign:'right'}}>Adjust Stock</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(p => {
              const stock = p.stock || 0;
              let statusLabel = 'In Stock';
              let badgeClass = 'admin-badge-success';

              if (stock === 0) {
                statusLabel = 'Out of Stock';
                badgeClass = 'admin-badge-danger';
              } else if (stock < 10) {
                statusLabel = 'Low Stock';
                badgeClass = 'admin-badge-warning';
              }

              return (
                <tr key={p.id}>
                  <td style={{display:'flex',alignItems:'center',gap:12}}>
                    <img
                      src={p.images[0]}
                      alt={p.name}
                      style={{width:36,height:46,objectFit:'cover',borderRadius:4}}
                      onError={handleImgError}
                    />
                    <div>
                      <div style={{fontWeight:600,color:'var(--plum)'}}>{p.name}</div>
                      <div style={{fontSize:11,color:'#6B7280'}}>{fmt(p.price)}</div>
                    </div>
                  </td>
                  <td>
                    <span className={'admin-badge ' + (p.category === 'Sarees' ? 'admin-badge-purple' : 'admin-badge-info')}>
                      {p.category}
                    </span>
                  </td>
                  <td>
                    <span className={'admin-badge ' + badgeClass}>
                      {statusLabel}
                    </span>
                  </td>
                  <td>
                    {p.category === 'Salwars' ? (
                      <div style={{display:'flex',gap:4}}>
                        {['S','M','L','XL','XXL'].map(sz => (
                          <span key={sz} style={{fontSize:10,background:'#F3F4F6',padding:'2px 6px',borderRadius:4,color:'#374151'}}>
                            {sz}: {Math.max(1, Math.round(stock / 5))}
                          </span>
                        ))}
                      </div>
                    ) : (
                      <span style={{fontSize:11,color:'#6B7280'}}>Standard Free Size</span>
                    )}
                  </td>
                  <td style={{textAlign:'center',fontFamily:'Bodoni Moda,serif',fontSize:18,fontWeight:700,color:'var(--plum)'}}>
                    {stock}
                  </td>
                  <td style={{textAlign:'right'}}>
                    <div style={{display:'inline-flex',gap:4}}>
                      <button
                        onClick={() => updateStock(p.id, -1)}
                        className="admin-btn-secondary"
                        style={{padding:'4px 10px'}}
                        title="Decrease stock"
                      >
                        -
                      </button>
                      <button
                        onClick={() => updateStock(p.id, 1)}
                        className="admin-btn-secondary"
                        style={{padding:'4px 10px'}}
                        title="Increase stock"
                      >
                        +
                      </button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AdminOffersTab({offers, setOffers, toast}){
  const [modalOpen, setModalOpen] = useState(false);

    title: '',
    description: '',
    discount: '20%',
    startDate: '2026-10-01',
    endDate: '2026-11-30',
    active: true
  });

  const toggleOffer = (id) => {
    const updated = offers.map(o => o.id === id ? {...o, active: !o.active} : o);
    setOffers(updated);
    try { localStorage.setItem('SRITHI_OFFERS_V3', JSON.stringify(updated)); } catch(e){}
    toast('Offer status updated');
  };

  const handleAddOffer = (e) => {
    e.preventDefault();
    if (!newOffer.title.trim()) return;
    const added = [{...newOffer, id: Date.now()}, ...offers];
    setOffers(added);
    try { localStorage.setItem('SRITHI_OFFERS_V3', JSON.stringify(added)); } catch(e){}
    setModalOpen(false);
    toast('Promotional offer created');
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24,flexWrap:'wrap',gap:16}}>

          <span>Add Offer</span>

          <div key={off.id} className="admin-card" style={{position:'relative'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
              <span className={'admin-badge ' + (off.active ? 'admin-badge-success' : 'admin-badge-danger')}>
                {off.active ? 'ACTIVE OFFER' : 'INACTIVE'}
              </span>
              <span style={{fontFamily:'Cinzel,serif',fontSize:18,fontWeight:700,color:'var(--dusty-rose)'}}>

            <h3 style={{fontFamily:'Bodoni Moda,serif',fontSize:18,fontWeight:600,color:'var(--plum)',marginBottom:6}}>
              {off.title}

              <span>Valid: {off.startDate} to {off.endDate}</span>

function App(){
  const [cart,setCart]=useState([]);
  const [wishlist,setWishlist]=useState([]);
  const [toasts,setToasts]=useState([]);
  const [page,setPage]=useState(window.location.hash||'#/');
  const [searchOpen,setSearchOpen]=useState(false);
  const [cartOpen,setCartOpen]=useState(false);
  const [searchQuery,setSearchQuery]=useState('');

  // 1. DYNAMIC DATA COLLECTIONS (Synchronized with localStorage & Admin CRUD)
  const [products, setProducts] = useState(() => {
    try {
      const saved = localStorage.getItem('SRITHI_PRODUCTS_V3');
      if (saved) {
        let parsed = JSON.parse(saved);
        [1, 2, 26, 27].forEach(targetId => {
          const fresh = ALL_PRODUCTS.find(p => p.id === targetId);
          if (fresh) {
            if (parsed.some(p => p.id === targetId)) {
              parsed = parsed.map(p => p.id === targetId ? fresh : p);
            } else {
              parsed = [fresh, ...parsed];
            }
          }
        });
        // Sanitize and guarantee correct numeric prices & zero discounts for uploaded items
        parsed = parsed.map(p => {
          if (p.id === 27) {
            return { ...p, price: 2799, originalPrice: 2799, discount: 0, sizes: ["L", "XL", "XXL"] };
          }
          if (p.id === 2) {
            return { ...p, price: 11000, originalPrice: 11000, discount: 0 };
          }
          if (p.id === 1) {
            return { ...p, price: 12000, originalPrice: 12000, discount: 0 };
          }
          if (p.id === 26) {
            return { ...p, price: 2199, originalPrice: 2199, discount: 0 };
          }
          return p;
        });
        localStorage.setItem('SRITHI_PRODUCTS_V3', JSON.stringify(parsed));
        return parsed;
      }
    } catch(e) {}
    return ALL_PRODUCTS;
  });

  const [orders, setOrders] = useState(() => {
    try {
      const saved = localStorage.getItem('SRITHI_ORDERS_V3');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return DEFAULT_ORDERS;
  });

  const [offers, setOffers] = useState(() => {
    try {
      const saved = localStorage.getItem('SRITHI_OFFERS_V3');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return DEFAULT_OFFERS;
  });

  const [reviewsList, setReviewsList] = useState(() => {
    try {
      const saved = localStorage.getItem('SRITHI_REVIEWS_V3');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return [
      { id: 1, name: "Kavitha Rangarajan", city: "Coimbatore", product: "Royal Crimson Kanjeevaram Silk Saree", rating: 5, date: "Sep 2026", status: "Approved", text: "Ordered for my daughter's wedding muhurtham. The handloom pure zari weight and sheen are unmatched. Packaging arrived in an exquisite atelier box." },
      { id: 2, name: "Dr. Ananya Sundaram", city: "Bangalore", product: "Mint Sage Green Hand-Painted Lotus Salwar Set", rating: 5, date: "Sep 2026", status: "Approved", text: "The hand-painted lotus dupatta is breathtaking! True boutique craftsmanship and exact tailored comfort ease." },
      { id: 3, name: "Sowmya Natarajan", city: "Chennai", product: "Golden Mustard Banarasi Silk Saree", rating: 5, date: "Aug 2026", status: "Approved", text: "The fabric drape is so graceful and fluid. Authentic silk mark quality and swift delivery to Chennai." }
    ];
  });

  const [settings, setSettings] = useState(() => {
    try {
      const saved = localStorage.getItem('SRITHI_SETTINGS_V3');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return DEFAULT_SETTINGS;
  });

  // Admin Auth State
  const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(() => AdminAuthService.isAuthenticated());

  useEffect(()=>{
    const h=()=>{
      setPage(window.location.hash||'#/');
      setIsAdminAuthenticated(AdminAuthService.isAuthenticated());
      window.scrollTo(0,0);
    };
    window.addEventListener('hashchange',h);
    return()=>window.removeEventListener('hashchange',h);
  },[]);

  const toast=(msg)=>{const id=Date.now();setToasts(t=>[...t,{id,msg}]);};

  const addToCart=useCallback((product,size)=>{
    setCart(c=>{
      const k=product.id+'-'+size;
      const ex=c.find(i=>i.id+'-'+i.size===k);
      if(ex){
        toast('Updated piece in bag');
        return c.map(i=>i.id+'-'+i.size===k?{...i,qty:i.qty+1}:i);
      }
      toast('Added piece to bag');
      return[...c,{...product,size,qty:1}];
    });
    setCartOpen(true);
  },[]);

  const updateQty=useCallback((id,size,qty)=>{
    if(qty<1){
      setCart(c=>c.filter(i=>!(i.id===id&&i.size===size)));
      toast('Removed from bag');
      return;
    }
    setCart(c=>c.map(i=>i.id===id&&i.size===size?{...i,qty}:i));
  },[]);

  const removeFromCart=useCallback((id,size)=>{
    setCart(c=>c.filter(i=>!(i.id===id&&i.size===size)));
    toast('Removed from bag');
  },[]);

  const toggleWishlist=useCallback((id)=>{
    setWishlist(w=>{
      if(w.includes(id)){
        toast('Removed from wishlist');
        return w.filter(x=>x!==id);
      }
      toast('Added to wishlist ♡');
      return[...w,id];
    });
  },[]);

  const hash=page;

  // ROUTE DISPATCH: SEPARATE ADMIN VS CUSTOMER EXPERIENCES

  // 1. ADMIN LOGIN PAGE (Completely independent from customer store)
  if (hash === '#/admin/login') {
    if (isAdminAuthenticated) {
      window.location.hash = '#/admin/dashboard';
      return null;
    }
    return (
      <div style={{minHeight:'100vh'}}>
        <AdminLoginPage onLoginSuccess={() => {
          setIsAdminAuthenticated(true);
          window.location.hash = '#/admin/dashboard';
        }} />
        {toasts.slice(-1).map(t=><Toast key={t.id} message={t.msg} onDone={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))}/>)}
      </div>
    );
  }

  // 2. PROTECTED ADMIN ROUTES (dashboard, products, orders, customers, categories, inventory, offers, reviews, settings)

    if (!isAdminAuthenticated) {
      window.location.hash = '#/admin/login';
      return null;
    }

      <div style={{minHeight:'100vh'}}>
        <AdminDashboardLayout
          page={hash}
          products={products}
          setProducts={setProducts}
          orders={orders}
          setOrders={setOrders}
          offers={offers}
          setOffers={setOffers}
          reviewsList={reviewsList}
          setReviewsList={setReviewsList}
          settings={settings}
          setSettings={setSettings}
          onLogout={() => {
            AdminAuthService.logout();
            setIsAdminAuthenticated(false);
            window.location.hash = '#/admin/login';
          }}
          toast={toast}
        />
        {toasts.slice(-1).map(t=><Toast key={t.id} message={t.msg} onDone={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))}/>)}
      </div>
    );
  }

  // 3. CUSTOMER STOREFRONT (Zero login required for customers!)
  const renderContent=()=>{
    if(hash==='#/'||hash===''){
      return(
        <>
          <HeroLookbook/>
          <CollectionIntro/>
          <SareeStoriesLookbook products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>
          <DiscoverYourStyle onSelectStyle={(styleName)=>{window.location.hash='#/collection';}}/>
          <SalwarJournal products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>
          <PieceOfTheWeek products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>
          <FreshFromAtelier products={products} wishlist={wishlist} toggleWishlist={toggleWishlist}/>
          <SignaturePieces products={products}/>
          <OffersSection/>
          <BrandSignatureStory/>
          <CustomerReviews/>
          <MomentsInSrithi products={products}/>
        </>

    }
    if(hash==='#/sarees'){
      return <CatalogPageV3 title="Saree Stories" eyebrow="The Saree Atelier" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} selectedCategory="Sarees"/>;
    }
    if(hash==='#/salwars'){
      return <CatalogPageV3 title="The Salwar Journal" eyebrow="Tailored Coordinated Sets" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} selectedCategory="Salwars"/>;

      return <CatalogPageV3 title="The Atelier Collection" eyebrow="Complete Atelier Curations" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    }
    if(hash==='#/new-arrivals'){

    }
    if(hash==='#/best-sellers'){
      return <CatalogPageV3 title="Signature Pieces" eyebrow="Client Favorites" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} initialFilter="best"/>;
    }
    if(hash==='#/offers'){
      return <CatalogPageV3 title="A Little More Beautiful" eyebrow="Special Curations" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} initialFilter="offers"/>;

    if(hash==='#/wishlist'){
      return <WishlistPageV3 wishlist={wishlist} products={products} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;

      const res=products.filter(p=>p.name.toLowerCase().includes(q)||p.fabric.toLowerCase().includes(q)||p.color.toLowerCase().includes(q)||p.category.toLowerCase().includes(q));
      return(
        <div style={{maxWidth:1440,margin:'0 auto',padding:'120px clamp(20px,4vw,60px) 80px'}}>
          <p className="v3-eyebrow">Search Results</p>
          <h1 className="v3-title-xl">"{searchQuery}"</h1>
          <p style={{fontSize:13,color:'var(--text-muted)',marginTop:6,marginBottom:40}}>{res.length} piece{res.length!==1?'s':''} found</p>
          <div className="product-grid-v3">
            {res.map(p=>(
              <div key={p.id} className="catalog-card-v3">
                <a href={'#/product/'+p.id} className="catalog-card-img-v3" aria-label={p.name}>
                  <img src={p.images[0]} alt={p.name} onError={handleImgError} loading="lazy"/>
                </a>
                <div className="catalog-card-info-v3">
                  <div>
                    <a href={'#/product/'+p.id} style={{textDecoration:'none',color:'inherit'}}><h3 className="catalog-card-title">{p.name}</h3></a>
                    <p className="catalog-card-meta">{p.fabric}</p>
                  </div>
                  <div className="catalog-card-price-row">
                    <span style={{fontFamily:'Bodoni Moda,serif',fontSize:18,fontWeight:600,color:'var(--dusty-rose)'}}>{fmt(p.price)}</span>
                    <a href={'#/product/'+p.id} className="btn-v3-primary" style={{padding:'8px 14px',fontSize:10}}>View Piece</a>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }
    return(
      <div style={{textAlign:'center',padding:'160px 24px'}}>
        <h2 style={{fontFamily:'Bodoni Moda,serif',fontSize:36,color:'var(--plum)',marginBottom:16}}>Silhouette Not Found</h2>
        <p style={{color:'var(--text-muted)',marginBottom:24}}>The page you requested could not be located in our atelier collection.</p>
        <a href="#/" className="btn-v3-primary">Return to Home</a>
      </div>
    );
  };

  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <FloatingHeader cart={cart} wishlist={wishlist} onSearch={()=>setSearchOpen(true)} onCartOpen={()=>setCartOpen(true)}/>
      <main style={{flex:1}}>{renderContent()}</main>
      <DarkFooter/>
      {searchOpen&&<SearchOverlayV3 onClose={()=>setSearchOpen(false)} onSearch={(q)=>{setSearchQuery(q);window.location.hash='#/search';}}/>}
      {cartOpen&&<ShoppingBagDrawer cart={cart} updateQty={updateQty} removeFromCart={removeFromCart} onClose={()=>setCartOpen(false)}/>}
      <MobileBottomNavV3 page={page} wishlist={wishlist} cart={cart} onCartOpen={()=>setCartOpen(true)}/>
      {toasts.slice(-1).map(t=><Toast key={t.id} message={t.msg} onDone={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))}/>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
