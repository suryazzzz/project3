    fabric: 'Pure Silk',
    color: '',
    pattern: 'Traditional Zari Weave',
    occasion: 'Bridal / Wedding / Festive',
    description: '',
    images: ['images/sarees/crimson-kanjeevaram.jpg'],
    urlInput: '',
    stock: 10,
    sizes: ['M', 'L', 'XL', 'XXL'],
    featured: false,
    newArrival: true,
    bestSeller: false,
    active: true
  };

  const [form, setForm] = useState(initialForm);

  // Auto-calculated discount percentage
  const calculatedDiscount = useMemo(() => {
    const p = Number(String(form.price || '').replace(/,/g, '').trim());
    const o = Number(String(form.originalPrice || '').replace(/,/g, '').trim());
    if (!isNaN(p) && !isNaN(o) && o > p && o > 0) {
      return Math.round(((o - p) / o) * 100);
    }
    return 0;
  }, [form.price, form.originalPrice]);

  const openAddModal = () => {
    setForm(initialForm);
    setEditingProduct(null);
    setAddModalOpen(true);
  };

  const openEditModal = (p) => {
    setEditingProduct(p);
    setForm({
      name: p.name || '',
      category: p.category === 'Sarees' ? 'Sarees' : 'Salwar Sets',
      price: p.price !== undefined ? p.price : '',
      originalPrice: p.originalPrice !== undefined ? p.originalPrice : '',
      fabric: p.fabric || '',
      color: p.color || '',
      pattern: p.pattern || '',
      occasion: p.occasion || '',
      description: p.description || '',
      images: Array.isArray(p.images) && p.images.length > 0 ? [...p.images] : ['images/sarees/crimson-kanjeevaram.jpg'],
      urlInput: '',
      stock: p.stock !== undefined ? p.stock : 10,
      sizes: Array.isArray(p.sizes) ? [...p.sizes] : ['M', 'L', 'XL', 'XXL'],
      featured: !!p.featured,
      newArrival: p.newArrival !== undefined ? !!p.newArrival : !!p.isNew,
      bestSeller: p.bestSeller !== undefined ? !!p.bestSeller : !!p.isBestSeller,
      active: p.active !== false
    });
    setAddModalOpen(true);
  };

  // Handle Image File Upload (converts to WebP/JPEG dataURL persistently)
  const handleFileUpload = async (e) => {
    const files = e.target.files;
    if (!files || files.length === 0) return;
    setUploadingImg(true);
    try {
      const processedList = [];
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.type.startsWith('image/')) {
          const dataUrl = await processImageFile(file, 1200, 1500, 0.92);
          processedList.push(dataUrl);
        }
      }
      if (processedList.length > 0) {
        setForm(f => ({ ...f, images: [...f.images, ...processedList] }));
        toast('Uploaded and optimized ' + processedList.length + ' image(s)');
      }
    } catch(err) {
      alert('Image upload failed: ' + err.message);
      toast('Image upload failed. Please try again.');
    } finally {
      setUploadingImg(false);
      e.target.value = '';
    }
  };

  // Add image URL manually
  const handleAddUrl = () => {
    const url = (form.urlInput || '').trim();
    if (!url) return;
    setForm(f => ({ ...f, images: [...f.images, url], urlInput: '' }));
  };

  // Remove image from gallery
  const handleRemoveImage = (index) => {
    if (form.images.length <= 1) {
      alert('A product must have at least one image.');
      return;
    }
    setForm(f => ({
      ...f,
      images: f.images.filter((_, i) => i !== index)
    }));
  };

  // Set image as primary (move to index 0)
  const handleSetPrimaryImage = (index) => {
    if (index === 0) return;
    setForm(f => {
      const copy = [...f.images];
      const [item] = copy.splice(index, 1);
      copy.unshift(item);
      return { ...f, images: copy };
    });
  };

  // Toggle Salwar Size
  const toggleSize = (size) => {
    setForm(f => {
      const current = f.sizes || [];
      const updated = current.includes(size) ? current.filter(s => s !== size) : [...current, size];
      return { ...f, sizes: updated };
    });
  };

  // Save Product (Create or Update)
  const handleSaveProduct = async (e) => {
    e.preventDefault();
    if (!form.name.trim()) {
      alert('Please enter a product name.');
      return;
    }
    const cleanPrice = String(form.price || '').replace(/,/g, '').trim();
    const priceNum = Number(cleanPrice);
    if (isNaN(priceNum) || priceNum < 0) {
      alert('Please enter a valid selling price.');
      return;
    }

    if (form.images.length === 0) {
      alert('Please upload or provide at least one product image.');
      return;
    }

    setIsSaving(true);
    try {
      if (editingProduct) {
        // Update existing product in persistent DB
        await SrithiProductDB.update(editingProduct.id, {
          name: form.name.trim(),
          category: form.category,
          price: priceNum,
          originalPrice: form.originalPrice !== '' ? Number(String(form.originalPrice).replace(/,/g, '').trim()) : priceNum,
          fabric: form.fabric.trim(),
          color: form.color.trim(),
          pattern: form.pattern.trim(),
          occasion: form.occasion.trim(),
          description: form.description.trim(),
          images: form.images,
          stock: Math.max(0, parseInt(form.stock, 10) || 0),
          sizes: form.category === 'Sarees' ? [] : form.sizes,
          featured: form.featured,
          newArrival: form.newArrival,
          bestSeller: form.bestSeller,
          active: form.active
        });
        toast('Product updated successfully.');
      } else {
        // Create new product in persistent DB
        await SrithiProductDB.create({
          name: form.name.trim(),
          category: form.category,
          price: priceNum,
          originalPrice: form.originalPrice !== '' ? Number(String(form.originalPrice).replace(/,/g, '').trim()) : priceNum,
          fabric: form.fabric.trim(),
          color: form.color.trim(),
          pattern: form.pattern.trim(),
          occasion: form.occasion.trim(),
          description: form.description.trim(),
          images: form.images,
          stock: Math.max(0, parseInt(form.stock, 10) || 0),
          sizes: form.category === 'Sarees' ? [] : form.sizes,
          featured: form.featured,
          newArrival: form.newArrival,
          bestSeller: form.bestSeller,
          active: form.active
        });
        toast('Product added successfully.');
      }
      setAddModalOpen(false);
    } catch(err) {
      alert('Unable to update product. Please try again: ' + err.message);
      toast('Unable to update product. Please try again.');
    } finally {
      setIsSaving(false);
    }
  };

  // Confirm Delete / Deactivate
  const confirmDelete = async () => {
    if (!deletingProduct) return;
    try {
      await SrithiProductDB.delete(deletingProduct.id, { soft: true });
      toast('Product deleted successfully.');
      setDeletingProduct(null);
    } catch(err) {
      alert('Failed to delete product: ' + err.message);
      toast('Unable to update product. Please try again.');
    }
  };

  // Quick Status Toggle
  const handleQuickStatusToggle = async (p) => {
    try {
      await SrithiProductDB.updateStatus(p.id, !p.active);
      toast(p.name + ' is now ' + (!p.active ? 'Active' : 'Inactive'));
    } catch(err) {
      toast('Unable to update product. Please try again.');
    }
  };

  // Quick Stock Adjustment
  const handleQuickStock = async (p, delta) => {
    const current = Number(p.stock) || 0;
    const newStock = Math.max(0, current + delta);
    try {
      await SrithiProductDB.updateStock(p.id, newStock);
      toast('Stock updated to ' + newStock);
    } catch(err) {
      toast('Unable to update stock.');
    }
  };

  // Search & Filtering
  const filtered = useMemo(() => {
    let list = products;

    // Search query
    if (searchTerm.trim()) {
      const q = searchTerm.toLowerCase().trim();
      list = list.filter(p =>
        (p.name && p.name.toLowerCase().includes(q)) ||
        (p.fabric && p.fabric.toLowerCase().includes(q)) ||
        (p.color && p.color.toLowerCase().includes(q)) ||
        (p.category && p.category.toLowerCase().includes(q)) ||
        String(p.id) === q ||
        ('#' + p.id) === q
      );
    }

    // Category Filter
    if (categoryFilter === 'Sarees') {
      list = list.filter(p => p.category === 'Sarees');
    } else if (categoryFilter === 'Salwar Sets') {
      list = list.filter(p => p.category === 'Salwars' || p.category === 'Salwar Sets');
    }

    // Status Filter
    if (statusFilter === 'Active') {
      list = list.filter(p => p.active !== false);
    } else if (statusFilter === 'Inactive') {
      list = list.filter(p => p.active === false);
    } else if (statusFilter === 'InStock') {
      list = list.filter(p => (Number(p.stock) || 0) > 0);
    } else if (statusFilter === 'OutOfStock') {
      list = list.filter(p => (Number(p.stock) || 0) === 0);
    }

    // Badge Filter
    if (badgeFilter === 'Featured') {
      list = list.filter(p => p.featured);
    } else if (badgeFilter === 'NewArrival') {
      list = list.filter(p => p.newArrival || p.isNew);
    } else if (badgeFilter === 'BestSeller') {
      list = list.filter(p => p.bestSeller || p.isBestSeller);
    }

    // Sorting
    const sorted = [...list];
    if (sortBy === 'name-asc') sorted.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    else if (sortBy === 'name-desc') sorted.sort((a,b) => (b.name||'').localeCompare(a.name||''));
    else if (sortBy === 'price-asc') sorted.sort((a,b) => (a.price||0) - (b.price||0));
    else if (sortBy === 'price-desc') sorted.sort((a,b) => (b.price||0) - (a.price||0));
    else if (sortBy === 'stock-asc') sorted.sort((a,b) => (Number(a.stock)||0) - (Number(b.stock)||0));
    else if (sortBy === 'stock-desc') sorted.sort((a,b) => (Number(b.stock)||0) - (Number(a.stock)||0));
    else sorted.sort((a,b) => (Number(b.id)||0) - (Number(a.id)||0)); // Newest first

    return sorted;
  }, [products, searchTerm, categoryFilter, statusFilter, badgeFilter, sortBy]);

  return (
    <div>
      {/* Header with Title and Add Product Button */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:16,marginBottom:24}}>
        <div>
          <h1 style={{fontFamily:'Bodoni Moda,serif',fontSize:26,fontWeight:600,color:'var(--plum)',marginBottom:4}}>
            Product Catalog Management
          </h1>
          <p style={{fontSize:13,color:'#6B7280'}}>
            Single Source of Truth: All modifications made here immediately persist and reflect live across the storefront.
          </p>
        </div>
        <button className="admin-btn-primary" onClick={openAddModal}>
          <span style={{fontSize:18,lineHeight:1}}>+</span> Add New Product
        </button>
      </div>

      {/* Search, Filter & Sort Controls */}
      <div className="admin-card" style={{padding:16,marginBottom:20}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))',gap:12,alignItems:'center'}}>
          {/* Search Input */}
          <div style={{position:'relative',gridColumn:'span 2',minWidth:240}}>
            <input
              type="text"
              className="admin-input"
              placeholder="Search by name, ID (#4), fabric, color..."
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)}
              style={{paddingLeft:36}}
            />
            <IcoSearch style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',width:16,height:16,color:'#9CA3AF'}}/>
            {searchTerm && (
              <button
                onClick={()=>setSearchTerm('')}
                style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'#9CA3AF',cursor:'pointer',fontSize:14}}
              >
                ✕
              </button>
            )}
          </div>

          {/* Category Filter */}
          <div>
            <select
              className="admin-input"
              value={categoryFilter}
              onChange={e => setCategoryFilter(e.target.value)}
            >
              <option value="All">All Categories</option>
              <option value="Sarees">Sarees</option>
              <option value="Salwar Sets">Salwar Sets</option>
            </select>
          </div>

          {/* Status Filter */}
          <div>
            <select
              className="admin-input"
              value={statusFilter}
              onChange={e => setStatusFilter(e.target.value)}
            >
              <option value="All">All Statuses</option>
              <option value="Active">Active Only</option>
              <option value="Inactive">Inactive / Hidden</option>
              <option value="InStock">In Stock</option>
              <option value="OutOfStock">Out of Stock</option>
            </select>
          </div>

          {/* Badge Filter */}
          <div>
            <select
              className="admin-input"
              value={badgeFilter}
              onChange={e => setBadgeFilter(e.target.value)}
            >
              <option value="All">All Badges</option>
              <option value="Featured">Featured</option>
              <option value="NewArrival">New Arrivals</option>
              <option value="BestSeller">Best Sellers</option>
            </select>
          </div>

          {/* Sort By */}
          <div>
            <select
              className="admin-input"
              value={sortBy}
              onChange={e => setSortBy(e.target.value)}
            >
              <option value="newest">Sort: Newest First</option>
              <option value="name-asc">Sort: Name (A-Z)</option>
              <option value="name-desc">Sort: Name (Z-A)</option>
              <option value="price-asc">Sort: Price (Low → High)</option>
              <option value="price-desc">Sort: Price (High → Low)</option>
              <option value="stock-asc">Sort: Stock (Low → High)</option>
              <option value="stock-desc">Sort: Stock (High → Low)</option>
            </select>
          </div>
        </div>

        {/* Counter Info */}
        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid #F3F4F6',display:'flex',justifyContent:'space-between',fontSize:12,color:'#6B7280'}}>
          <span>Showing <strong>{filtered.length}</strong> of <strong>{products.length}</strong> silhouettes</span>
          {(searchTerm || categoryFilter !== 'All' || statusFilter !== 'All' || badgeFilter !== 'All' || sortBy !== 'newest') && (
            <button
              onClick={()=>{setSearchTerm('');setCategoryFilter('All');setStatusFilter('All');setBadgeFilter('All');setSortBy('newest');}}
              style={{background:'none',border:'none',color:'var(--dusty-rose)',cursor:'pointer',textDecoration:'underline',fontSize:12}}
            >
              Reset Filters
            </button>
          )}
        </div>
      </div>

      {/* Products Table */}
      <div className="admin-table-wrap">
        <table className="admin-table">
          <thead>
            <tr>
              <th>SILHOUETTE</th>
              <th>FABRIC &amp; COLOR</th>
              <th>PRICE</th>
              <th>STOCK</th>
              <th>STATUS</th>
              <th style={{textAlign:'right'}}>ACTIONS</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr>
                <td colSpan="6" style={{textAlign:'center',padding:40,color:'#9CA3AF'}}>
                  No products match your search or filter criteria.
                </td>
              </tr>
            ) : (
              filtered.map(p => {
                const isOutOfStock = (Number(p.stock) || 0) === 0;
                const primaryImg = (Array.isArray(p.images) && p.images[0]) || 'images/sarees/crimson-kanjeevaram.jpg';
                return (
                  <tr key={p.id} style={{opacity: p.active === false ? 0.65 : 1}}>
                    {/* Silhouette Column */}
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:12}}>
                        <div style={{position:'relative',width:44,height:55,borderRadius:3,overflow:'hidden',background:'#F3F4F6',flexShrink:0}}>
                          <img src={primaryImg} alt={p.name} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={handleImgError}/>
                        </div>
                        <div>
                          <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                            <span style={{fontWeight:600,color:'var(--plum)'}}>{p.name}</span>
                            <span style={{fontSize:10,color:'#9CA3AF'}}>#{p.id}</span>
                          </div>
                          <div style={{fontSize:11,color:'#6B7280',marginTop:2}}>
                            {p.category}
                            {p.featured && <span style={{marginLeft:6,background:'#FEF3C7',color:'#92400E',padding:'1px 5px',borderRadius:2,fontSize:9,fontWeight:700}}>FEATURED</span>}
                            {(p.newArrival || p.isNew) && <span style={{marginLeft:4,background:'#E0E7FF',color:'#3730A3',padding:'1px 5px',borderRadius:2,fontSize:9,fontWeight:700}}>NEW</span>}
                            {(p.bestSeller || p.isBestSeller) && <span style={{marginLeft:4,background:'#FEE2E2',color:'#991B1B',padding:'1px 5px',borderRadius:2,fontSize:9,fontWeight:700}}>BESTSELLER</span>}
                          </div>
                        </div>
                      </div>
                    </td>

                    {/* Fabric & Color */}
                    <td>
                      <div style={{fontSize:12.5}}>{p.fabric || '—'}</div>
                      <div style={{fontSize:11,color:'#9CA3AF'}}>{p.color || '—'}</div>
                    </td>

                    {/* Price */}
                    <td>
                      <div style={{fontWeight:600,color:'var(--plum)',fontSize:13.5}}>
                        {fmt(p.price)}
                      </div>
                      {p.originalPrice > p.price && (
                        <div style={{fontSize:11,color:'#9CA3AF',textDecoration:'line-through'}}>
                          {fmt(p.originalPrice)}
                          <span style={{marginLeft:4,color:'#059669',textDecoration:'none',fontWeight:600}}>
                            {p.discount}% Off
                          </span>
                        </div>
                      )}
                    </td>

                    {/* Stock Management with Quick Buttons */}
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <button
                          onClick={()=>handleQuickStock(p, -1)}
                          style={{width:22,height:22,background:'#F3F4F6',border:'1px solid #E5E7EB',borderRadius:2,cursor:'pointer',fontSize:12,lineHeight:1}}
                          title="Decrease stock by 1"
                        >
                          −
                        </button>
                        <span style={{minWidth:28,textAlign:'center',fontWeight:600,color: isOutOfStock ? '#DC2626' : 'inherit',fontSize:13}}>
                          {p.stock !== undefined ? p.stock : 10}
                        </span>
                        <button
                          onClick={()=>handleQuickStock(p, 1)}
                          style={{width:22,height:22,background:'#F3F4F6',border:'1px solid #E5E7EB',borderRadius:2,cursor:'pointer',fontSize:12,lineHeight:1}}
                          title="Increase stock by 1"
                        >
                          +
                        </button>
                      </div>
                      {isOutOfStock ? (
                        <div style={{fontSize:10,color:'#DC2626',fontWeight:700,marginTop:2}}>OUT OF STOCK</div>
                      ) : (
                        <div style={{fontSize:10,color:'#059669',marginTop:2}}>In Stock</div>
                      )}
                    </td>

                    {/* Status Pill Toggle */}
                    <td>
                      <button
                        onClick={()=>handleQuickStatusToggle(p)}
                        style={{
                          padding:'3px 8px',
                          fontSize:11,
                          fontWeight:600,
                          borderRadius:12,
                          border:'none',
                          cursor:'pointer',
                          background: p.active !== false ? '#DEF7EC' : '#F3F4F6',
                          color: p.active !== false ? '#03543F' : '#6B7280'
                        }}
                        title="Click to toggle Active / Inactive"
                      >
                        {p.active !== false ? '● Active' : '○ Inactive'}
                      </button>
                    </td>

                    {/* Actions */}
                    <td style={{textAlign:'right'}}>
                      <div style={{display:'inline-flex',gap:6}}>
                        <button
                          className="admin-btn-secondary"
                          style={{padding:'6px 10px',fontSize:11}}
                          onClick={()=>openEditModal(p)}
                          title="Edit product details, pricing, images, stock"
                        >
                          <IcoEdit style={{width:13,height:13,marginRight:4}}/> Edit
                        </button>
                        <button
                          className="admin-btn-danger"
                          style={{padding:'6px 8px',fontSize:11}}
                          onClick={()=>setDeletingProduct(p)}
                          title="Deactivate / Delete product"
                        >
                          <IcoTrash style={{width:13,height:13}}/>
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })
            )}
          </tbody>
        </table>
      </div>

      {/* ADD / EDIT PRODUCT MODAL */}
      {addModalOpen && (
        <div className="admin-modal-backdrop">
          <div className="admin-modal" style={{maxWidth:760,maxHeight:'90vh',display:'flex',flexDirection:'column'}}>
            <div className="admin-modal-header" style={{flexShrink:0}}>
              <div>
                <h2 style={{fontFamily:'Bodoni Moda,serif',fontSize:20,fontWeight:600,color:'var(--plum)'}}>
                  {editingProduct ? 'Edit Silhouette (ID: #' + editingProduct.id + ')' : 'Add New Silhouette to Atelier'}
                </h2>
                <p style={{fontSize:12,color:'#6B7280',marginTop:2}}>
                  {editingProduct ? 'Update pricing, images, fabric details and inventory.' : 'Create a new piece. It will immediately publish live upon saving.'}
                </p>
              </div>
              <button className="admin-modal-close" onClick={()=>setAddModalOpen(false)}>✕</button>
            </div>

            <form onSubmit={handleSaveProduct} style={{overflowY:'auto',padding:'20px 24px',flex:1}}>
              {/* Basic Information */}
              <div style={{marginBottom:18}}>
                <div style={{fontSize:11,fontFamily:'Cinzel,serif',letterSpacing:'.15em',textTransform:'uppercase',color:'var(--dusty-rose)',fontWeight:700,marginBottom:10}}>
                  1. BASIC INFORMATION
                </div>
                <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:14}}>
                  <div className="admin-field-group">
                    <label className="admin-field-label">Product Name *</label>
                    <input
                      type="text"
                      className="admin-input"
                      placeholder="e.g. Pure Tissue Kanchipuram Silk Saree"
                      value={form.name}
                      onChange={e=>setForm({...form, name: e.target.value})}
                      required
                    />
                  </div>
                  <div className="admin-field-group">
                    <label className="admin-field-label">Category *</label>
                    <select
                      className="admin-input"
                      value={form.category}
                      onChange={e=>setForm({...form, category: e.target.value})}
                    >
                      <option value="Sarees">Sarees</option>
                      <option value="Salwar Sets">Salwar Sets</option>
                    </select>
                  </div>
                </div>

                <div className="admin-field-group">
                  <label className="admin-field-label">Product Description</label>
                  <textarea
                    className="admin-input"
                    rows="3"
                    placeholder="Describe the weaving, craftsmanship, borders, and styling narrative..."
                    value={form.description}
                    onChange={e=>setForm({...form, description: e.target.value})}
                  />
                </div>
              </div>

              {/* Pricing & Discounts */}
              <div style={{marginBottom:18,paddingTop:14,borderTop:'1px solid #F3F4F6'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                  <div style={{fontSize:11,fontFamily:'Cinzel,serif',letterSpacing:'.15em',textTransform:'uppercase',color:'var(--dusty-rose)',fontWeight:700}}>
                    2. PRICING &amp; DISCOUNTS
                  </div>
                  {calculatedDiscount > 0 && (
                    <span style={{background:'#DEF7EC',color:'#03543F',fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:3}}>
                      Calculated Discount: {calculatedDiscount}% OFF
                    </span>
                  )}
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14}}>
                  <div className="admin-field-group">
                    <label className="admin-field-label">Selling Price (₹) *</label>
                    <input
                      type="number"
                      min="0"
                      step="1"
                      className="admin-input"
                      placeholder="e.g. 12000"
                      value={form.price}
                      onChange={e=>setForm({...form, price: e.target.value})}
                      required
                    />
                  </div>
                  <div className="admin-field-group">
                    <label className="admin-field-label">Original Price (₹)</label>
                    <input
                      type="number"
                      min="0"
                      step="1"
                      className="admin-input"
                      placeholder="e.g. 12000 (same if no offer)"
                      value={form.originalPrice}
                      onChange={e=>setForm({...form, originalPrice: e.target.value})}
                    />
                  </div>
                  <div className="admin-field-group">
                    <label className="admin-field-label">Active Stock *</label>
                    <input
                      type="number"
                      min="0"
                      className="admin-input"
                      placeholder="e.g. 10 (0 = Out of Stock)"
                      value={form.stock}
                      onChange={e=>setForm({...form, stock: e.target.value})}
                      required
                    />
                  </div>
                </div>
              </div>

              {/* Multi-Image Gallery & Uploader */}
              <div style={{marginBottom:18,paddingTop:14,borderTop:'1px solid #F3F4F6'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                  <div style={{fontSize:11,fontFamily:'Cinzel,serif',letterSpacing:'.15em',textTransform:'uppercase',color:'var(--dusty-rose)',fontWeight:700}}>
                    3. PRODUCT IMAGES ({form.images.length})
                  </div>
                  <label style={{display:'inline-flex',alignItems:'center',gap:6,background:'var(--plum)',color:'#fff',padding:'6px 12px',borderRadius:3,fontSize:11,fontFamily:'Cinzel,serif',cursor:'pointer'}}>
                    <span>📷 {uploadingImg ? 'Optimizing...' : 'Upload Photos'}</span>
                    <input
                      type="file"
                      accept="image/*"
                      multiple
                      onChange={handleFileUpload}
                      disabled={uploadingImg}
                      style={{display:'none'}}
                    />
                  </label>
                </div>

                {/* Gallery Grid */}
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(130px, 1fr))',gap:10,marginBottom:12}}>
                  {form.images.map((img, i)=>(
                    <div
                      key={i}
                      style={{
                        position:'relative',
                        border: i === 0 ? '2px solid var(--gilded-gold)' : '1px solid #E5E7EB',
                        borderRadius:4,
                        padding:4,
                        background:'#FAF7F2'
                      }}
                    >
                      <div style={{width:'100%',height:120,borderRadius:2,overflow:'hidden',background:'#fff'}}>
                        <img src={img} alt={'Preview ' + (i+1)} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={handleImgError}/>
                      </div>
                      {i === 0 && (
                        <div style={{position:'absolute',top:8,left:8,background:'var(--plum)',color:'var(--gold-light)',fontSize:8.5,fontWeight:700,fontFamily:'Cinzel,serif',padding:'2px 5px',borderRadius:2}}>
                          PRIMARY
                        </div>
                      )}
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6,gap:4}}>
                        {i !== 0 ? (
                          <button
                            type="button"
                            onClick={()=>handleSetPrimaryImage(i)}
                            style={{fontSize:10,background:'none',border:'1px solid #D1D5DB',padding:'2px 5px',borderRadius:2,cursor:'pointer',color:'#4B5563'}}
                            title="Make this the primary cover photo"
                          >
                            ★ Primary
                          </button>
                        ) : (
                          <span style={{fontSize:10,color:'#059669',fontWeight:600}}>Cover Photo</span>
                        )}
                        <button
                          type="button"
                          onClick={()=>handleRemoveImage(i)}
                          style={{fontSize:11,background:'none',border:'none',color:'#DC2626',cursor:'pointer',padding:2}}
                          title="Remove image"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Direct Image Path / URL Input */}
                <div style={{display:'flex',gap:8}}>
                  <input
                    type="text"
                    className="admin-input"
                    placeholder="Or enter image URL / path (e.g. images/sarees/my-piece.webp)"
                    value={form.urlInput}
                    onChange={e=>setForm({...form, urlInput: e.target.value})}
                  />
                  <button
                    type="button"
                    className="admin-btn-secondary"
                    onClick={handleAddUrl}
                    style={{whiteSpace:'nowrap',padding:'0 14px'}}
                  >
                    Add URL
                  </button>
                </div>
              </div>

              {/* Sizes Selection (Salwar Sets only) */}
              <div style={{marginBottom:18,paddingTop:14,borderTop:'1px solid #F3F4F6'}}>
                <div style={{fontSize:11,fontFamily:'Cinzel,serif',letterSpacing:'.15em',textTransform:'uppercase',color:'var(--dusty-rose)',fontWeight:700,marginBottom:10}}>
                  4. SPECIFICATIONS &amp; SIZES
                </div>

                {form.category === 'Sarees' ? (
                  <div style={{fontSize:12.5,color:'#6B7280',background:'#F9FAFB',padding:'10px 14px',borderRadius:3,marginBottom:12}}>
                    ℹ️ Sarees are standard 5.5-meter drapes with matching blouse pieces. Sizes are not applicable.
                  </div>
                ) : (
                  <div style={{marginBottom:14}}>
                    <label className="admin-field-label" style={{marginBottom:6}}>Available Sizes (Click to toggle)</label>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      {['S', 'M', 'L', 'XL', 'XXL', '3XL'].map(sz => {
                        const isSel = (form.sizes || []).includes(sz);
                        return (
                          <button
                            type="button"
                            key={sz}
                            onClick={()=>toggleSize(sz)}
                            style={{
                              padding:'6px 14px',
                              borderRadius:3,
                              border:'1px solid ' + (isSel ? 'var(--plum)' : '#D1D5DB'),
                              background: isSel ? 'var(--plum)' : '#fff',
                              color: isSel ? '#fff' : '#374151',
                              fontWeight:600,
                              cursor:'pointer',
                              fontSize:12
                            }}
                          >
                            {sz} {isSel ? '✓' : ''}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                  <div className="admin-field-group">
                    <label className="admin-field-label">Fabric</label>
                    <input
                      type="text"
                      className="admin-input"
                      placeholder="e.g. Pure Tissue Silk, Silk Cotton, Jute Cotton"
                      value={form.fabric}
                      onChange={e=>setForm({...form, fabric: e.target.value})}
                    />
                  </div>
                  <div className="admin-field-group">
                    <label className="admin-field-label">Color / Shade</label>
                    <input
                      type="text"
                      className="admin-input"
                      placeholder="e.g. Coral Red, Golden Mustard, Peacock Teal"
                      value={form.color}
                      onChange={e=>setForm({...form, color: e.target.value})}
                    />
                  </div>
                  <div className="admin-field-group">
                    <label className="admin-field-label">Pattern / Weave</label>
                    <input
                      type="text"
                      className="admin-input"
                      placeholder="e.g. Traditional Zari Weave, Floral Jaal"
                      value={form.pattern}
                      onChange={e=>setForm({...form, pattern: e.target.value})}
                    />
                  </div>
                  <div className="admin-field-group">
                    <label className="admin-field-label">Occasion</label>
                    <input
                      type="text"
                      className="admin-input"
                      placeholder="e.g. Bridal / Wedding / Festive Celebrations"
                      value={form.occasion}
                      onChange={e=>setForm({...form, occasion: e.target.value})}
                    />
                  </div>
                </div>
              </div>

              {/* Status & Badges */}
              <div style={{marginBottom:18,paddingTop:14,borderTop:'1px solid #F3F4F6'}}>
                <div style={{fontSize:11,fontFamily:'Cinzel,serif',letterSpacing:'.15em',textTransform:'uppercase',color:'var(--dusty-rose)',fontWeight:700,marginBottom:10}}>
                  5. STOREFRONT VISIBILITY &amp; BADGES
                </div>
                <div style={{display:'flex',gap:24,flexWrap:'wrap',alignItems:'center'}}>
                  <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,cursor:'pointer'}}>
                    <input
                      type="checkbox"
                      checked={form.active}
                      onChange={e=>setForm({...form, active: e.target.checked})}
                    />
                    <span><strong>Active</strong> (Visible on customer storefront)</span>
                  </label>

                  <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,cursor:'pointer'}}>
                    <input
                      type="checkbox"
                      checked={form.featured}
                      onChange={e=>setForm({...form, featured: e.target.checked})}
                    />
                    <span><strong>Featured</strong> (Piece of the Week / Hero)</span>
                  </label>

                  <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,cursor:'pointer'}}>
                    <input
                      type="checkbox"
                      checked={form.newArrival}
                      onChange={e=>setForm({...form, newArrival: e.target.checked})}
                    />
                    <span><strong>New Arrival</strong></span>
                  </label>

                  <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,cursor:'pointer'}}>
                    <input
                      type="checkbox"
                      checked={form.bestSeller}
                      onChange={e=>setForm({...form, bestSeller: e.target.checked})}
                    />
                    <span><strong>Best Seller</strong></span>
                  </label>
                </div>
              </div>

              {/* Actions */}
              <div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:20,paddingTop:16,borderTop:'1px solid #E5E7EB'}}>
                <button
                  type="button"
                  className="admin-btn-secondary"
                  onClick={()=>setAddModalOpen(false)}
                  disabled={isSaving}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="admin-btn-primary"
                  disabled={isSaving}
                  style={{minWidth:140}}
                >
                  {isSaving ? 'Saving to Database...' : (editingProduct ? 'Save Changes' : 'Create Product')}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* DELETE / DEACTIVATE CONFIRMATION MODAL */}
      {deletingProduct && (
        <div className="admin-modal-backdrop">
          <div className="admin-modal" style={{maxWidth:480}}>
            <div className="admin-modal-header">
              <h2 style={{fontFamily:'Bodoni Moda,serif',fontSize:18,fontWeight:600,color:'#DC2626'}}>
                Confirm Deactivation
              </h2>
              <button className="admin-modal-close" onClick={()=>setDeletingProduct(null)}>✕</button>
            </div>
            <div style={{padding:'20px 24px'}}>
              <p style={{fontSize:13.5,lineHeight:1.6,color:'#374151',marginBottom:16}}>
                Are you sure you want to delete / deactivate <strong>"{deletingProduct.name}"</strong> (ID: #{deletingProduct.id})?
              </p>
              <div style={{fontSize:12,color:'#6B7280',background:'#FEF2F2',padding:'10px 14px',borderRadius:4,borderLeft:'3px solid #DC2626',marginBottom:20}}>
                ● The piece will be immediately removed from the customer storefront, search results, and lookbooks.<br/>
                ● Existing customer order history will safely retain their historical reference.
              </div>
              <div style={{display:'flex',justifyContent:'flex-end',gap:12}}>
                <button
                  type="button"
                  className="admin-btn-secondary"
                  onClick={()=>setDeletingProduct(null)}
                >
                  Cancel
                </button>
                <button
                  type="button"
                  className="admin-btn-danger"
                  onClick={confirmDelete}
                  style={{padding:'8px 18px'}}
                >
                  Confirm Delete
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}





// ============================================================================
// 3. ORDERS TAB (Full Order Lifecycle & Fulfillment Manager)
// ============================================================================
function AdminOrdersTab({orders, setOrders, toast}){
  const [searchTerm, setSearchTerm] = useState('');
  const [statusFilter, setStatusFilter] = useState('All');
  const [selectedOrder, setSelectedOrder] = useState(null);

  const statuses = ['All', 'Confirmed', 'Processing', 'Shipped', 'Delivered', 'Cancelled'];

  const filteredOrders = useMemo(() => {
    let list = orders;
    if (searchTerm.trim()) {
      const q = searchTerm.toLowerCase().trim();
      list = list.filter(o =>
        (o.id && String(o.id).toLowerCase().includes(q)) ||
        (o.customer && o.customer.toLowerCase().includes(q)) ||
        (o.mobile && o.mobile.toLowerCase().includes(q)) ||
        (o.email && o.email.toLowerCase().includes(q)) ||
        (o.city && o.city.toLowerCase().includes(q))
      );
    }
    if (statusFilter !== 'All') {
      list = list.filter(o => o.status === statusFilter);
    }
    return list;
  }, [orders, searchTerm, statusFilter]);

  const updateOrderStatus = (orderId, newStatus) => {
    const updated = orders.map(o => {
      if (o.id === orderId) {
        return { ...o, status: newStatus };
      }
      return o;
    });
    setOrders(updated);
    try {
      localStorage.setItem('SRITHI_ORDERS_V3', JSON.stringify(updated));
    } catch(e) {}
    if (toast) toast('Order ' + orderId + ' updated to ' + newStatus);
    if (selectedOrder && selectedOrder.id === orderId) {
      setSelectedOrder(prev => ({ ...prev, status: newStatus }));
    }
  };

  const deleteOrder = (orderId) => {
    if (!window.confirm('Are you sure you want to delete order ' + orderId + '?')) return;
    const updated = orders.filter(o => o.id !== orderId);
    setOrders(updated);
    try {
      localStorage.setItem('SRITHI_ORDERS_V3', JSON.stringify(updated));
    } catch(e) {}
    if (toast) toast('Order ' + orderId + ' removed');
    if (selectedOrder && selectedOrder.id === orderId) {
      setSelectedOrder(null);
    }
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:16,marginBottom:24}}>
        <div>
          <h1 style={{fontFamily:'Bodoni Moda,serif',fontSize:26,fontWeight:600,color:'var(--plum)',marginBottom:4}}>
            Orders &amp; Dispatch Management
          </h1>
          <p style={{fontSize:13,color:'#6B7280'}}>
            Manage client orders, track delivery lifecycles, and coordinate bespoke Coimbatore studio dispatches.
          </p>
        </div>
      </div>

      {/* Filter and Search Controls */}
      <div className="admin-card" style={{padding:16,marginBottom:20}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))',gap:12,alignItems:'center'}}>
          <div style={{position:'relative',gridColumn:'span 2',minWidth:240}}>
            <input
              type="text"
              className="admin-input"
              placeholder="Search by Order ID, client name, mobile, city..."
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)}
              style={{paddingLeft:36}}
            />
            <IcoSearch style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',width:16,height:16,color:'#9CA3AF'}}/>
            {searchTerm && (
              <button
                onClick={()=>setSearchTerm('')}
                style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'#9CA3AF',cursor:'pointer',fontSize:14}}
              >
                ✕
              </button>
            )}
          </div>

          <div>
            <select
              className="admin-input"
              value={statusFilter}
              onChange={e => setStatusFilter(e.target.value)}
            >
              {statuses.map(st => (
                <option key={st} value={st}>{st === 'All' ? 'All Order Statuses' : st}</option>
              ))}
            </select>
          </div>
        </div>

        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid #F3F4F6',display:'flex',justifyContent:'space-between',fontSize:12,color:'#6B7280'}}>
          <span>Showing <strong>{filteredOrders.length}</strong> of <strong>{orders.length}</strong> orders</span>
          {(searchTerm || statusFilter !== 'All') && (
            <button
              onClick={()=>{setSearchTerm('');setStatusFilter('All');}}
              style={{background:'none',border:'none',color:'var(--dusty-rose)',cursor:'pointer',textDecoration:'underline',fontSize:12}}
            >
              Reset Filters
            </button>
          )}
        </div>
      </div>

      {/* Orders Table */}
      <div className="admin-table-wrap">
        <table className="admin-table">
          <thead>
            <tr>
              <th>ORDER ID</th>
              <th>CLIENT &amp; LOCATION</th>
              <th>ITEMS ORDERED</th>
              <th>AMOUNT &amp; PAYMENT</th>
              <th>STATUS</th>
              <th style={{textAlign:'right'}}>ACTIONS</th>
            </tr>
          </thead>
          <tbody>
            {filteredOrders.length === 0 ? (
              <tr>
                <td colSpan="6" style={{textAlign:'center',padding:'40px 20px',color:'#9CA3AF'}}>
                  No orders match your search criteria.
                </td>
              </tr>
            ) : (
              filteredOrders.map(o => {
                const itemsList = Array.isArray(o.items) ? o.items : [];
                return (
                  <tr key={o.id}>
                    <td>
                      <div style={{fontFamily:'Cinzel,serif',fontWeight:700,fontSize:13,color:'var(--plum)'}}>
                        #{String(o.id).replace('#','')}
                      </div>
                      <div style={{fontSize:11,color:'#9CA3AF',marginTop:3}}>
                        {o.date || 'Recent Order'}
                      </div>
                    </td>
                    <td>
                      <div style={{fontWeight:600,color:'#111827'}}>{o.customer}</div>
                      <div style={{fontSize:11,color:'#6B7280'}}>{o.city || 'India'}, {o.state || ''}</div>
                      <div style={{fontSize:11,color:'#9CA3AF'}}>{o.mobile}</div>
                    </td>
                    <td style={{maxWidth:240}}>
                      {itemsList.length === 0 ? (
                        <span style={{fontSize:12,color:'#6B7280'}}>{o.product || 'Bespoke Order'}</span>
                      ) : (
                        <div style={{display:'flex',flexDirection:'column',gap:4}}>
                          {itemsList.map((it, idx) => (
                            <div key={idx} style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                              {it.image && (
                                <img
                                  src={it.image}
                                  alt={it.name}
                                  style={{width:28,height:36,objectFit:'cover',borderRadius:2,background:'#FAF5F2',flexShrink:0}}
                                  onError={handleImgError}
                                />
                              )}
                              <div>
                                <div style={{fontWeight:500,color:'var(--plum)',maxWidth:180,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                                  {it.name}
                                </div>
                                <div style={{fontSize:10.5,color:'#9CA3AF'}}>
                                  Qty: {it.qty} {it.size ? '· Size ' + it.size : ''}
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </td>
                    <td>
                      <div style={{fontFamily:'Bodoni Moda,serif',fontSize:15,fontWeight:600,color:'var(--plum)'}}>
                        ₹{(o.amount || 0).toLocaleString('en-IN')}
                      </div>
                      <div style={{fontSize:10.5,color:'#059669',fontWeight:500,marginTop:2}}>
                        {o.paymentMethod || 'Prepaid'}
                      </div>
                    </td>
                    <td>
                      <select
                        value={o.status || 'Confirmed'}
                        onChange={(e)=>updateOrderStatus(o.id, e.target.value)}
                        style={{
                          padding:'4px 8px',
                          fontSize:11,
                          fontWeight:600,
                          borderRadius:4,
                          border:'1px solid #D1D5DB',
                          background:'#FFF',
                          cursor:'pointer',
                          color: o.status === 'Delivered' ? '#065F46' : o.status === 'Cancelled' ? '#991B1B' : '#1E40AF'
                        }}
                      >
                        <option value="Confirmed">Confirmed</option>
                        <option value="Processing">Processing</option>
                        <option value="Shipped">Shipped</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Cancelled">Cancelled</option>
                      </select>
                    </td>
                    <td style={{textAlign:'right'}}>
                      <div style={{display:'inline-flex',gap:6}}>
                        <button
                          className="admin-btn-secondary"
                          style={{padding:'6px 10px',fontSize:11}}
                          onClick={()=>setSelectedOrder(o)}
                          title="View order details and shipping manifest"
                        >
                          <IcoEye style={{width:13,height:13,marginRight:4}}/> View
                        </button>
                        <button
                          className="admin-btn-danger"
                          style={{padding:'6px 8px',fontSize:11}}
                          onClick={()=>deleteOrder(o.id)}
                          title="Delete Order"
                        >
                          <IcoTrash style={{width:13,height:13}}/>
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })
            )}
          </tbody>
        </table>
      </div>

      {/* Order Detail Modal */}
      {selectedOrder && (
        <div className="admin-modal-overlay" onClick={()=>setSelectedOrder(null)}>
          <div className="admin-modal-content" style={{maxWidth:600}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
              <div>
                <p style={{fontFamily:'Cinzel,serif',fontSize:11,letterSpacing:'.15em',color:'var(--dusty-rose)',textTransform:'uppercase',marginBottom:2}}>
                  ORDER MANIFEST &amp; INVOICE
                </p>
                <h3 style={{fontFamily:'Bodoni Moda,serif',fontSize:22,color:'var(--plum)',margin:0}}>
                  #{String(selectedOrder.id).replace('#','')}
                </h3>
                <span style={{fontSize:12,color:'#6B7280'}}>Placed on {selectedOrder.date || 'Recent'}</span>
              </div>
              <button
                onClick={()=>setSelectedOrder(null)}
                style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#9CA3AF'}}
              >
                ✕
              </button>
            </div>

            {/* Client Info Grid */}
            <div style={{background:'#F9FAFB',padding:16,borderRadius:8,marginBottom:20,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,fontSize:12}}>
              <div>
                <span style={{color:'#9CA3AF',fontSize:10.5,textTransform:'uppercase',fontWeight:600,display:'block',marginBottom:2}}>Client Information</span>
                <strong style={{fontSize:13,color:'#111827'}}>{selectedOrder.customer}</strong>
                <div style={{color:'#4B5563',marginTop:2}}>{selectedOrder.mobile}</div>
                <div style={{color:'#6B7280'}}>{selectedOrder.email || 'N/A'}</div>
              </div>
              <div>
                <span style={{color:'#9CA3AF',fontSize:10.5,textTransform:'uppercase',fontWeight:600,display:'block',marginBottom:2}}>Shipping Address</span>
                <div style={{color:'#374151',lineHeight:1.4}}>
                  {selectedOrder.address || 'Address provided at checkout'},<br/>
                  {selectedOrder.city}, {selectedOrder.state} - {selectedOrder.pincode}
                </div>
              </div>
            </div>

            {/* Items Breakdown */}
            <div style={{marginBottom:20}}>
              <span style={{fontSize:11,fontWeight:600,letterSpacing:'.08em',color:'#374151',textTransform:'uppercase',display:'block',marginBottom:10}}>
                Items Ordered
              </span>
              <div style={{border:'1px solid #E5E7EB',borderRadius:6,overflow:'hidden'}}>
                {(Array.isArray(selectedOrder.items) ? selectedOrder.items : []).map((it, idx) => (
                  <div key={idx} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',borderBottom:idx < selectedOrder.items.length - 1 ? '1px solid #F3F4F6' : 'none'}}>
                    {it.image && (
                      <img src={it.image} alt={it.name} style={{width:36,height:46,objectFit:'cover',borderRadius:3,background:'#FAF5F2'}} onError={handleImgError}/>
                    )}
                    <div style={{flex:1}}>
                      <div style={{fontWeight:600,fontSize:13,color:'var(--plum)'}}>{it.name}</div>
                      <div style={{fontSize:11,color:'#6B7280'}}>
                        Category: {it.category || 'Atelier'} {it.size ? '· Size: ' + it.size : ''}
                      </div>
                    </div>
                    <div style={{textAlign:'right'}}>

}

function AdminCustomersTab({orders}){
  const [searchTerm, setSearchTerm] = useState('');
  const [selectedCustomer, setSelectedCustomer] = useState(null);

  // Aggregate unique customers from order history
  const customersList = useMemo(() => {
    const map = new Map();
    (orders || []).forEach(o => {
      const key = (o.email && o.email.trim()) || (o.mobile && o.mobile.trim()) || (o.customer && o.customer.trim()) || 'Guest';
      if (!map.has(key)) {
        map.set(key, {
          id: key,
          name: o.customer || 'Guest Client',
          mobile: o.mobile || 'N/A',
          email: o.email || 'N/A',
          city: o.city || 'India',
          state: o.state || '',
          totalOrders: 0,
          totalSpent: 0,
          orders: [],
          lastOrderDate: o.date || 'Recent'
        });
      }
      const record = map.get(key);
      record.totalOrders += 1;
      record.totalSpent += (Number(o.amount) || 0);
      record.orders.push(o);
      if (o.date) record.lastOrderDate = o.date;
    });
    return Array.from(map.values());
  }, [orders]);

  const filteredCustomers = useMemo(() => {
    if (!searchTerm.trim()) return customersList;
    const q = searchTerm.toLowerCase().trim();
    return customersList.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.city.toLowerCase().includes(q) ||
      c.mobile.toLowerCase().includes(q) ||
      c.email.toLowerCase().includes(q)
    );

  const totalClients = customersList.length;
  const totalRevenue = customersList.reduce((s, c) => s + c.totalSpent, 0);

        <div className="admin-card">

          <IcoSearch style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',width:16,height:16,color:'#9CA3AF'}}/>

// 4. INVENTORY TAB (Connected to SrithiProductDB)
function AdminInventoryTab({products, setProducts, toast}){
  const [searchTerm, setSearchTerm] = useState('');
  const [filterStock, setFilterStock] = useState('all');

  const updateStock = async (productId, delta) => {
    const p = products.find(prod => prod.id === productId);
    if (!p) return;
    const current = Number(p.stock) || 0;
    const newStock = Math.max(0, current + delta);
    try {
      await SrithiProductDB.updateStock(productId, newStock);
      toast('Stock updated to ' + newStock);
    } catch(err) {
      toast('Failed to update stock');
    }
  };

  const filtered = useMemo(() => {
    return products.filter(p => {
      const matchSearch = (p.name || '').toLowerCase().includes(searchTerm.toLowerCase());
      const stock = Number(p.stock) || 0;
      if (filterStock === 'low') return matchSearch && stock > 0 && stock <= 5;
      if (filterStock === 'out') return matchSearch && stock === 0;
      return matchSearch;
    });
  }, [products, searchTerm, filterStock]);

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h1 style={{fontFamily:'Bodoni Moda,serif',fontSize:26,fontWeight:600,color:'var(--plum)',marginBottom:4}}>
          Inventory Management
        </h1>
        <p style={{fontSize:13,color:'#6B7280'}}>
          Live stock tracking across Sarees and Salwars with instant persistence to the database.
        </p>
      </div>

      <div className="admin-card" style={{padding:16,marginBottom:20}}>
        <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
          <div style={{position:'relative',flex:1,minWidth:240}}>
            <input
              type="text"
              className="admin-input"
              placeholder="Search inventory by product name..."
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)}
              style={{paddingLeft:38}}
            />
            <IcoSearch style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',width:16,height:16,color:'#9CA3AF'}}/>
          </div>
          <div style={{display:'flex',gap:6}}>
            {[
              { id: 'all', label: 'All Stock' },
              { id: 'low', label: 'Low Stock (≤5)' },
              { id: 'out', label: 'Out of Stock' }
            ].map(f => (
              <button
                key={f.id}
                onClick={()=>setFilterStock(f.id)}
                style={{
                  padding:'8px 14px',
                  fontSize:12,
                  fontFamily:'Plus Jakarta Sans,sans-serif',
                  fontWeight:600,
                  borderRadius:3,
                  border:'1px solid ' + (filterStock === f.id ? 'var(--plum)' : '#E5E7EB'),
                  background: filterStock === f.id ? 'var(--plum)' : '#fff',
                  color: filterStock === f.id ? '#fff' : '#4B5563',
                  cursor:'pointer'
                }}
              >
                {f.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div className="admin-table-wrap">
        <table className="admin-table">
          <thead>
            <tr>
              <th>SILHOUETTE</th>
              <th>CATEGORY</th>
              <th>PRICE</th>
              <th>CURRENT STOCK</th>
              <th>STATUS</th>
              <th style={{textAlign:'right'}}>QUICK ADJUST</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr>
                <td colSpan="6" style={{textAlign:'center',padding:40,color:'#9CA3AF'}}>
                  No inventory records match your criteria.
                </td>
              </tr>
            ) : (
              filtered.map(p => {
                const stock = Number(p.stock) || 0;
                const isOut = stock === 0;
                const isLow = stock > 0 && stock <= 5;
                const primaryImg = (Array.isArray(p.images) && p.images[0]) || 'images/sarees/crimson-kanjeevaram.jpg';
                return (
                  <tr key={p.id}>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:12}}>
                        <div style={{width:40,height:50,borderRadius:2,overflow:'hidden',background:'#F3F4F6',flexShrink:0}}>
                          <img src={primaryImg} alt={p.name} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={handleImgError}/>
                        </div>
                        <div>
                          <div style={{fontWeight:600,color:'var(--plum)'}}>{p.name}</div>
                          <div style={{fontSize:11,color:'#9CA3AF'}}>#{p.id}</div>
                        </div>
                      </div>
                    </td>
                    <td>{p.category}</td>
                    <td>{fmt(p.price)}</td>
                    <td>
                      <span style={{fontSize:14,fontWeight:700,color: isOut ? '#DC2626' : (isLow ? '#D97706' : '#059669')}}>
                        {stock} unit{stock !== 1 ? 's' : ''}
                      </span>
                    </td>
                    <td>
                      {isOut ? (
                        <span className="admin-badge admin-badge-cancelled">Out of Stock</span>
                      ) : isLow ? (
                        <span className="admin-badge admin-badge-shipped">Low Stock</span>
                      ) : (
                        <span className="admin-badge admin-badge-delivered">In Stock</span>
                      )}
                    </td>
                    <td style={{textAlign:'right'}}>
                      <div style={{display:'inline-flex',gap:6,alignItems:'center'}}>
                        <button
                          onClick={()=>updateStock(p.id, -1)}
                          style={{width:26,height:26,background:'#F3F4F6',border:'1px solid #D1D5DB',borderRadius:2,cursor:'pointer',fontSize:14}}
                          title="Decrease 1"
                        >
                          −
                        </button>
                        <button
                          onClick={()=>updateStock(p.id, 1)}
                          style={{width:26,height:26,background:'#F3F4F6',border:'1px solid #D1D5DB',borderRadius:2,cursor:'pointer',fontSize:14}}
                          title="Increase 1"
                        >
                          +
                        </button>
                        <button
                          onClick={()=>updateStock(p.id, 5)}
                          style={{padding:'0 8px',height:26,background:'#F3F4F6',border:'1px solid #D1D5DB',borderRadius:2,cursor:'pointer',fontSize:11}}
                          title="Add 5"

function App(){
  const [cart,setCart]=useState([]);
  const [wishlist,setWishlist]=useState([]);
  const [toasts,setToasts]=useState([]);
  const [page,setPage]=useState(window.location.hash||'#/');
  const [searchOpen,setSearchOpen]=useState(false);
  const [cartOpen,setCartOpen]=useState(false);
  const [searchQuery,setSearchQuery]=useState('');

  // 1. DYNAMIC DATA COLLECTIONS (Synchronized with SrithiProductDB as Single Source of Truth)
  const [products, setProducts] = useState(() => {
    return SrithiProductDB.getSynchronousAll({ includeInactive: true });
  });

  // Cross-tab and persistent database synchronization
  useEffect(() => {
    SrithiProductDB.init().then(prods => {
      if (prods && Array.isArray(prods)) {
        setProducts(prods);
      }
    });

    const unsubscribe = SrithiProductDB.subscribe(updated => {
      setProducts(updated);
    });

    const handleStorage = (e) => {
      if (e.key === 'SRITHI_PRODUCTS_V3' && e.newValue) {
        try {
          const parsed = JSON.parse(e.newValue);
          if (Array.isArray(parsed)) {
            setProducts(parsed);
          }
        } catch(err) {}
      }
    };
    window.addEventListener('storage', handleStorage);

    return () => {
      unsubscribe();
      window.removeEventListener('storage', handleStorage);
    };
  }, []);

  const [orders, setOrders] = useState(() => {
    try {
      const saved = localStorage.getItem('SRITHI_ORDERS_V3');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return DEFAULT_ORDERS;
  });

  const [offers, setOffers] = useState(() => {
    try {
      const saved = localStorage.getItem('SRITHI_OFFERS_V3');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return DEFAULT_OFFERS;
  });

  const [reviewsList, setReviewsList] = useState(() => {
    try {
      const saved = localStorage.getItem('SRITHI_REVIEWS_V3');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return [
      { id: 1, name: "Kavitha Rangarajan", city: "Coimbatore", product: "Royal Crimson Kanjeevaram Silk Saree", rating: 5, date: "Sep 2026", status: "Approved", text: "Ordered for my daughter's wedding muhurtham. The handloom pure zari weight and sheen are unmatched. Packaging arrived in an exquisite atelier box." },
      { id: 2, name: "Dr. Ananya Sundaram", city: "Bangalore", product: "Mint Sage Green Hand-Painted Lotus Salwar Set", rating: 5, date: "Sep 2026", status: "Approved", text: "The hand-painted lotus dupatta is breathtaking! True boutique craftsmanship and exact tailored comfort ease." },
      { id: 3, name: "Sowmya Natarajan", city: "Chennai", product: "Golden Mustard Banarasi Silk Saree", rating: 5, date: "Aug 2026", status: "Approved", text: "The fabric drape is so graceful and fluid. Authentic silk mark quality and swift delivery to Chennai." }
    ];
  });

  const [settings, setSettings] = useState(() => {
    try {
      const saved = localStorage.getItem('SRITHI_SETTINGS_V3');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return DEFAULT_SETTINGS;
  });

  // Admin Auth State
  const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(() => AdminAuthService.isAuthenticated());

  useEffect(()=>{
    const h=()=>{
      setPage(window.location.hash||'#/');
      setIsAdminAuthenticated(AdminAuthService.isAuthenticated());
      window.scrollTo(0,0);
    };
    window.addEventListener('hashchange',h);
    return()=>window.removeEventListener('hashchange',h);
  },[]);

  const toast=(msg)=>{const id=Date.now();setToasts(t=>[...t,{id,msg}]);};

  // Derive enriched cart using latest product information from products state
  const enrichedCart = useMemo(() => {
    return cart.map(item => {
      const prod = products.find(p => p.id === item.id);
      if (!prod) return item;
      return {
        ...item,
        name: prod.name || item.name,
        price: prod.price !== undefined ? prod.price : item.price,
        originalPrice: prod.originalPrice !== undefined ? prod.originalPrice : item.originalPrice,
        images: prod.images || item.images,
        fabric: prod.fabric || item.fabric,
        stock: prod.stock !== undefined ? prod.stock : 10,
        active: prod.active !== false
      };
    });
  }, [cart, products]);

  const addToCart=useCallback((product,size)=>{
    setCart(c=>{
      const k=product.id+'-'+size;
      const ex=c.find(i=>i.id+'-'+i.size===k);
      if(ex){
        toast('Updated piece in bag');
        return c.map(i=>i.id+'-'+i.size===k?{...i,qty:i.qty+1}:i);
      }
      toast('Added piece to bag');
      return[...c,{...product,size,qty:1}];
    });
    setCartOpen(true);
  },[]);

  const updateQty=useCallback((id,size,qty)=>{
    if(qty<1){
      setCart(c=>c.filter(i=>!(i.id===id&&i.size===size)));
      toast('Removed from bag');
      return;
    }
    setCart(c=>c.map(i=>i.id===id&&i.size===size?{...i,qty}:i));
  },[]);

  const removeFromCart=useCallback((id,size)=>{
    setCart(c=>c.filter(i=>!(i.id===id&&i.size===size)));
    toast('Removed from bag');
  },[]);

  const toggleWishlist=useCallback((id)=>{
    setWishlist(w=>{
      if(w.includes(id)){
        toast('Removed from wishlist');
        return w.filter(x=>x!==id);
      }
      toast('Added to wishlist ♡');
      return[...w,id];
    });
  },[]);

  const hash=page;

  // ROUTE DISPATCH: SEPARATE ADMIN VS CUSTOMER EXPERIENCES

  // 1. ADMIN LOGIN PAGE (Completely independent from customer store)
  if (hash === '#/admin/login') {
    if (isAdminAuthenticated) {
      window.location.hash = '#/admin/dashboard';
      return null;
    }
    return (
      <div style={{minHeight:'100vh'}}>
        <AdminLoginPage onLoginSuccess={() => {
          setIsAdminAuthenticated(true);
          window.location.hash = '#/admin/dashboard';
        }} />
        {toasts.slice(-1).map(t=><Toast key={t.id} message={t.msg} onDone={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))}/>)}
      </div>
    );
  }

  // 2. PROTECTED ADMIN ROUTES (dashboard, products, orders, customers, categories, inventory, offers, reviews, settings)
  if (hash.startsWith('#/admin')) {
    if (!isAdminAuthenticated) {
      window.location.hash = '#/admin/login';
      return null;
    }
    return (
      <div style={{minHeight:'100vh'}}>
        <AdminDashboardLayout
          page={hash}
          products={products}
          setProducts={setProducts}
          orders={orders}
          setOrders={setOrders}
          offers={offers}
          setOffers={setOffers}
          reviewsList={reviewsList}
          setReviewsList={setReviewsList}
          settings={settings}
          setSettings={setSettings}
          onLogout={() => {
            AdminAuthService.logout();
            setIsAdminAuthenticated(false);
            window.location.hash = '#/admin/login';
          }}
          toast={toast}
        />
        {toasts.slice(-1).map(t=><Toast key={t.id} message={t.msg} onDone={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))}/>)}
      </div>
    );
  }

  // 3. CUSTOMER STOREFRONT (Zero login required for customers!)
  const renderContent=()=>{
    if(hash==='#/'||hash===''){
      return(
        <>
          <HeroLookbook/>
          <CollectionIntro/>
          <SareeStoriesLookbook products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>
          <DiscoverYourStyle onSelectStyle={(styleName)=>{window.location.hash='#/collection';}}/>
          <SalwarJournal products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>
          <PieceOfTheWeek products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>
          <FreshFromAtelier products={products} wishlist={wishlist} toggleWishlist={toggleWishlist}/>
          <SignaturePieces products={products}/>
          <OffersSection/>
          <BrandSignatureStory/>
          <CustomerReviews/>
          <MomentsInSrithi products={products}/>
        </>
      );
    }
    if(hash==='#/sarees'){
      return <CatalogPageV3 title="Saree Stories" eyebrow="The Saree Atelier" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} selectedCategory="Sarees"/>;
    }
    if(hash==='#/salwars'){
      return <CatalogPageV3 title="The Salwar Journal" eyebrow="Tailored Coordinated Sets" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} selectedCategory="Salwars"/>;
    }
    if(hash==='#/collection'){
      return <CatalogPageV3 title="The Atelier Collection" eyebrow="Complete Atelier Curations" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    }
    if(hash==='#/new-arrivals'){
      return <CatalogPageV3 title="Fresh from the Atelier" eyebrow="Just Arrived" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} initialFilter="new"/>;
    }
    if(hash==='#/best-sellers'){
      return <CatalogPageV3 title="Signature Pieces" eyebrow="Client Favorites" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} initialFilter="best"/>;
    }
    if(hash==='#/offers'){
      return <CatalogPageV3 title="A Little More Beautiful" eyebrow="Special Curations" products={products} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} initialFilter="offers"/>;
    }
    if(hash==='#/wishlist'){
      return <WishlistPageV3 wishlist={wishlist} products={products} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    }
    if(hash==='#/checkout'){
      return <CheckoutPageV3 cart={cart} onOrderPlaced={(newOrder) => {
        setOrders(prev => {
          const updated = [newOrder, ...prev];
          try { localStorage.setItem('SRITHI_ORDERS_V3', JSON.stringify(updated)); } catch(e){}
          return updated;
        });
        setCart([]);
      }}/>;
    }
    if(hash==='#/contact'){
      return <ContactPageV3/>;
    }
    if(hash==='#/size-guide'){
      return(
        <div style={{maxWidth:700,margin:'0 auto',padding:'120px 24px 80px'}}>
          <p className="v3-eyebrow">Studio Measurements</p>
          <h1 className="v3-title-xl" style={{marginBottom:16}}>Salwar Fitting Guide</h1>
          <p style={{fontSize:14,color:'var(--text-muted)',marginBottom:32}}>All measurements are indicated in inches with a standard tailored comfort ease.</p>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:14,background:'var(--white)',border:'1px solid var(--border-gold)'}}>
            <thead>
              <tr style={{background:'var(--plum)',color:'var(--gold-light)',fontFamily:'Cinzel,serif',fontSize:11,letterSpacing:'.15em',textTransform:'uppercase'}}>
                <th style={{padding:'12px 18px',textAlign:'left'}}>Size</th>
                <th style={{padding:'12px 18px',textAlign:'left'}}>Bust</th>
                <th style={{padding:'12px 18px',textAlign:'left'}}>Waist</th>
                <th style={{padding:'12px 18px',textAlign:'left'}}>Hip</th>
              </tr>
            </thead>
            <tbody>
              {[
                ['S','34"','28"','36"'],
                ['M','36"','30"','38"'],
                ['L','38"','32"','40"'],
                ['XL','40"','34"','42"'],
                ['XXL','42"','36"','44"']
              ].map(([s,b,w,h],i)=>(
                <tr key={s} style={{background:i%2===0?'var(--champagne)':'var(--white)',borderBottom:'1px solid var(--border-subtle)'}}>
                  <td style={{padding:'12px 18px',fontWeight:700,color:'var(--dusty-rose)',fontFamily:'Cinzel,serif'}}>{s}</td>
                  <td style={{padding:'12px 18px'}}>{b}</td>
                  <td style={{padding:'12px 18px'}}>{w}</td>
                  <td style={{padding:'12px 18px'}}>{h}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }
    if(hash.startsWith('#/product/')){
      const pid=Number(hash.replace('#/product/',''));
      const p=products.find(x=>x.id===pid);
      if(p) return <ProductDetailPageV3 product={p} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    }
    if(hash==='#/search'){
      const q=searchQuery.toLowerCase();
      const res=products.filter(p=>p.name.toLowerCase().includes(q)||p.fabric.toLowerCase().includes(q)||p.color.toLowerCase().includes(q)||p.category.toLowerCase().includes(q));
      return(
        <div style={{maxWidth:1440,margin:'0 auto',padding:'120px clamp(20px,4vw,60px) 80px'}}>
          <p className="v3-eyebrow">Search Results</p>
          <h1 className="v3-title-xl">"{searchQuery}"</h1>
          <p style={{fontSize:13,color:'var(--text-muted)',marginTop:6,marginBottom:40}}>{res.length} piece{res.length!==1?'s':''} found</p>
          <div className="product-grid-v3">
            {res.map(p=>(
              <div key={p.id} className="catalog-card-v3">
                <a href={'#/product/'+p.id} className="catalog-card-img-v3" aria-label={p.name}>
                  <img src={p.images[0]} alt={p.name} onError={handleImgError} loading="lazy"/>
                </a>
                <div className="catalog-card-info-v3">
                  <div>
                    <a href={'#/product/'+p.id} style={{textDecoration:'none',color:'inherit'}}><h3 className="catalog-card-title">{p.name}</h3></a>
                    <p className="catalog-card-meta">{p.fabric}</p>
                  </div>
                  <div className="catalog-card-price-row">
                    <span style={{fontFamily:'Bodoni Moda,serif',fontSize:18,fontWeight:600,color:'var(--dusty-rose)'}}>{fmt(p.price)}</span>
                    <a href={'#/product/'+p.id} className="btn-v3-primary" style={{padding:'8px 14px',fontSize:10}}>View Piece</a>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }
    return(
      <div style={{textAlign:'center',padding:'160px 24px'}}>
        <h2 style={{fontFamily:'Bodoni Moda,serif',fontSize:36,color:'var(--plum)',marginBottom:16}}>Silhouette Not Found</h2>
        <p style={{color:'var(--text-muted)',marginBottom:24}}>The page you requested could not be located in our atelier collection.</p>
        <a href="#/" className="btn-v3-primary">Return to Home</a>
      </div>
    );
  };

  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <FloatingHeader cart={enrichedCart} wishlist={wishlist} onSearch={()=>setSearchOpen(true)} onCartOpen={()=>setCartOpen(true)}/>
      <main style={{flex:1}}>{renderContent()}</main>
      <DarkFooter/>
      {searchOpen&&<SearchOverlayV3 onClose={()=>setSearchOpen(false)} onSearch={(q)=>{setSearchQuery(q);window.location.hash='#/search';}}/>}
      {cartOpen&&<ShoppingBagDrawer cart={enrichedCart} updateQty={updateQty} removeFromCart={removeFromCart} onClose={()=>setCartOpen(false)}/>}
      <MobileBottomNavV3 page={page} wishlist={wishlist} cart={enrichedCart} onCartOpen={()=>setCartOpen(true)}/>
      {toasts.slice(-1).map(t=><Toast key={t.id} message={t.msg} onDone={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))}/>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
