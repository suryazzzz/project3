<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRITHI THE COUTURE — The Atelier Collection</title>
  <meta name="description" content="Srithi The Couture — The Atelier Collection. An immersive luxury atelier celebrating curated Sarees and bespoke Salwar Sets crafted for the moments that matter." />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel:wght@400;500;600;700&family=Italiana&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Tenor+Sans&display=swap" rel="stylesheet" />
  <style>
:root{
  --plum:#240D22;
  --plum-dark:#170615;
  --plum-light:#3A1437;
  --plum-rich:#461742;
  --blush:#F6EBEB;
  --blush-accent:#E8C8CB;
  --blush-deep:#D89EA5;
  --champagne:#FAF7F2;
  --champagne-2:#F2ECE2;
  --espresso:#1C1415;
  --dusty-rose:#A65E73;
  --dusty-rose-light:#C48B9F;
  --soft-cream:#FFFDF9;
  --gilded-gold:#C5A880;
  --gold-light:#DFCAAA;
  --text-dark:#201719;
  --text-muted:#766A6E;
  --border-subtle:rgba(36,13,34,0.12);
  --border-gold:rgba(197,168,128,0.35);
  --white:#FFFFFF;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--champagne);
  color:var(--text-dark);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--champagne)}
::-webkit-scrollbar-thumb{background:var(--plum);border-radius:3px}

/* Typography Utility */
.font-editorial{font-family:'Bodoni Moda',serif}
.font-italiana{font-family:'Italiana',serif}
.font-cinzel{font-family:'Cinzel',serif}
.font-sans{font-family:'Plus Jakarta Sans',sans-serif}

/* Top Announcement Strip */
.announcement-v3{
  background:var(--plum-dark);
  color:var(--gold-light);
  text-align:center;
  font-size:11px;
  letter-spacing:.16em;
  padding:7px 16px;
  font-family:'Tenor Sans','Plus Jakarta Sans',sans-serif;
  text-transform:uppercase;
  font-weight:400;
  border-bottom:1px solid rgba(197,168,128,0.2);
}

/* Floating Navigation - ALWAYS High-Contrast, Legible & Visible */
.header-v3-sticky-wrap{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:900;
  box-shadow:0 4px 25px rgba(36,13,34,0.08);
}
.header-v3{
  background:rgba(250,247,242,0.98);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-gold);
}
.header-v3-inner{
  max-width:1440px;
  margin:0 auto;
  padding:11px 40px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}
.header-v3-brand{
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:12px;
}
.header-v3-logo{
  height:34px;
  width:auto;
  filter:brightness(0) !important;
  transition:transform .2s;
  object-fit:contain;
}
.header-v3-logo-text{
  font-family:'Italiana','Bodoni Moda',serif;
  font-size:20px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--plum) !important;
  font-weight:600;
  white-space:nowrap;
}
.header-v3-nav{
  display:flex;
  align-items:center;
  gap:28px;
}
.header-v3-nav a{
  font-family:'Tenor Sans','Plus Jakarta Sans',sans-serif;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--plum) !important;
  font-weight:500;
  transition:color .25s,transform .2s;
  position:relative;
  padding:6px 0;
}
.header-v3-nav a::after{
  content:'';
  position:absolute;
  bottom:0;
  left:50%;
  width:0;
  height:1.5px;
  background:var(--dusty-rose);
  transition:all .25s ease;
  transform:translateX(-50%);
}
.header-v3-nav a:hover{
  color:var(--dusty-rose) !important;
}
.header-v3-nav a:hover::after{
  width:100%;
}
.header-v3-actions{
  display:flex;
  align-items:center;
  gap:20px;
  justify-content:flex-end;
}
.header-v3-btn{
  background:none;
  border:none;
  cursor:pointer;
  color:var(--plum) !important;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:color .2s,transform .15s;
  text-decoration:none;
}
.header-v3-btn:hover{
  color:var(--dusty-rose) !important;
  transform:translateY(-1px);
}
.v3-badge{
  position:absolute;
  top:-6px;
  right:-8px;
  background:var(--dusty-rose);
  color:var(--white);
  font-size:9px;
  font-weight:700;
  min-width:16px;
  height:16px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
}
.v3-menu-toggle{
  display:none;
  flex-direction:column;
  gap:5px;
  background:none;
  border:none;
  cursor:pointer;
  padding:6px;
}
.v3-menu-toggle span{
  display:block;
  width:24px;
  height:1.5px;
  background:var(--plum) !important;
  transition:background .3s;
}

/* Fullscreen Immersive Lookbook Hero */
.hero-v3{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--plum-dark);
}
.hero-v3-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 20%;
  filter:brightness(0.78) saturate(1.1);
  transform:scale(1.04);
  animation:heroZoom 14s ease-out forwards;
}
@keyframes heroZoom{
  0%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.hero-v3-overlay{
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center, rgba(36,13,34,0.4) 0%, rgba(23,6,21,0.82) 100%),
             linear-gradient(180deg, rgba(23,6,21,0.45) 0%, rgba(23,6,21,0.2) 50%, rgba(23,6,21,0.88) 100%);
}
.hero-v3-content{
  position:relative;
  z-index:10;
  text-align:center;
  max-width:980px;
  padding:140px 24px 80px;
  color:var(--white);
}
.hero-v3-eyebrow{
  font-family:'Cinzel',serif;
  font-size:clamp(11px,1.4vw,14px);
  letter-spacing:.36em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:20px;
  font-weight:600;
  animation:fadeUp .9s cubic-bezier(.16,1,.3,1) both;
}
.hero-v3-title{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(46px,8.5vw,110px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.02em;
  color:var(--champagne);
  margin-bottom:28px;
  text-transform:uppercase;
  animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .15s both;
}
.hero-v3-title span{
  display:block;
  font-style:italic;
  font-family:'Bodoni Moda',serif;
  color:var(--blush-accent);
  text-transform:none;
}
.hero-v3-sub{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(14px,1.8vw,18px);
  font-weight:300;
  letter-spacing:.08em;
  color:rgba(250,247,242,0.85);
  margin-bottom:44px;
  max-width:540px;
  margin-left:auto;
  margin-right:auto;
  animation:fadeUp 1.1s cubic-bezier(.16,1,.3,1) .3s both;
}
.hero-v3-actions{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  animation:fadeUp 1.2s cubic-bezier(.16,1,.3,1) .45s both;
}
.btn-v3-primary{
  background:var(--gilded-gold);
  color:var(--plum-dark);
  border:1px solid var(--gilded-gold);
  padding:15px 36px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-weight:700;
  text-decoration:none;
  cursor:pointer;
  transition:all .25s ease;
  display:inline-block;
}
.btn-v3-primary:hover{
  background:var(--gold-light);
  border-color:var(--gold-light);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(197,168,128,0.3);
}
.btn-v3-outline{
  background:transparent;
  color:var(--champagne);
  border:1px solid rgba(250,247,242,0.6);
  padding:15px 36px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
  transition:all .25s ease;
  display:inline-block;
}
.btn-v3-outline:hover{
  background:rgba(250,247,242,0.15);
  border-color:var(--champagne);
  transform:translateY(-2px);
}
.hero-v3-scroll{
  position:absolute;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:rgba(250,247,242,0.7);
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.24em;
  text-transform:uppercase;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  animation:floatBounce 2.4s ease-in-out infinite;
}
@keyframes floatBounce{
  0%,100%{transform:translate(-50%,0)}
  50%{transform:translate(-50%,6px)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* Collection Intro / Editorial Statement */
.intro-statement{
  padding:120px 40px;
  max-width:1200px;
  margin:0 auto;
  text-align:center;
}
.intro-statement-eyebrow{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--dusty-rose);
  font-weight:600;
  margin-bottom:24px;
}
.intro-statement-title{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(38px,6vw,84px);
  font-weight:400;
  line-height:.96;
  letter-spacing:-.01em;
  color:var(--plum);
  text-transform:uppercase;
  margin-bottom:32px;
}
.intro-statement-body{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(15px,1.6vw,19px);
  line-height:1.8;
  color:var(--text-muted);
  max-width:680px;
  margin:0 auto 36px;
  font-weight:300;
}
.intro-statement-divider{
  width:60px;
  height:1px;
  background:var(--gilded-gold);
  margin:0 auto;
}

/* Section Common Headers */
.v3-section{
  padding:100px clamp(20px,5vw,80px);
}
.v3-section-head{
  margin-bottom:54px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border-subtle);
  padding-bottom:20px;
}
.v3-eyebrow{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--dusty-rose);
  font-weight:600;
  margin-bottom:10px;
}
.v3-title-xl{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(32px,5vw,68px);
  font-weight:400;
  line-height:1;
  color:var(--plum);
  letter-spacing:-.01em;
}
.v3-link-arrow{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--plum);
  text-decoration:none;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:all .2s;
}
.v3-link-arrow:hover{
  color:var(--dusty-rose);
  transform:translateX(4px);
}

/* Saree Stories - Asymmetric Editorial Lookbook */
.saree-lookbook-grid{
  display:grid;
  grid-template-columns:1.2fr 0.8fr 0.8fr;
  grid-template-rows:auto auto;
  gap:24px;
}
.lookbook-item{
  position:relative;
  overflow:hidden;
  background:var(--champagne-2);
  text-decoration:none;
  display:block;
  cursor:pointer;
  transition:transform .4s ease,box-shadow .4s ease;
}
.lookbook-item.featured{
  grid-row:span 2;
  min-height:680px;
}
.lookbook-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top center;
  transition:transform .75s cubic-bezier(.16,1,.3,1),filter .5s ease;
}
.lookbook-item:hover img{
  transform:scale(1.06);
}
.lookbook-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(23,6,21,0.85) 0%, rgba(23,6,21,0.2) 55%, transparent 100%);
  transition:background .3s;
}
.lookbook-item:hover .lookbook-overlay{
  background:linear-gradient(to top, rgba(23,6,21,0.92) 0%, rgba(23,6,21,0.3) 65%, transparent 100%);
}
.lookbook-content{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:28px 24px;
  color:var(--white);
  z-index:2;
}
.lookbook-tag{
  font-family:'Cinzel',serif;
  font-size:9.5px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:6px;
}
.lookbook-name{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(18px,2vw,28px);
  font-weight:400;
  line-height:1.2;
  margin-bottom:8px;
}
.lookbook-price-row{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:12px;
}
.lookbook-price{
  font-family:'Bodoni Moda',serif;
  font-size:22px;
  font-weight:600;
  color:var(--blush-accent);
}
.lookbook-orig{
  font-size:12px;
  text-decoration:line-through;
  opacity:.7;
}
.lookbook-cta{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--white);
  display:inline-flex;
  align-items:center;
  gap:6px;
  opacity:0;
  transform:translateY(8px);
  transition:all .3s ease;
  font-weight:700;
}
.lookbook-item:hover .lookbook-cta{
  opacity:1;
  transform:translateY(0);
}
.lookbook-wish{
  position:absolute;
  top:16px;
  right:16px;
  z-index:5;
  background:rgba(255,255,255,0.9);
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .2s;
  color:var(--plum);
}
.lookbook-wish:hover,.lookbook-wish.active{
  background:var(--dusty-rose);
  color:var(--white);
}

/* Discover Your Style Section */
.style-section{
  background:var(--blush);
  padding:100px clamp(20px,5vw,80px);
}
.style-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-top:40px;
}
.style-card{
  position:relative;
  aspect-ratio:3/4;
  overflow:hidden;
  text-decoration:none;
  display:block;
  cursor:pointer;
  border:1px solid rgba(197,168,128,0.25);
  background:var(--champagne-2);
}
.style-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top;
  transition:transform .7s ease;
}
.style-card:hover img{
  transform:scale(1.08);
}
.style-card-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(36,13,34,0.1) 0%, rgba(36,13,34,0.85) 100%);
  transition:background .3s;
}
.style-card:hover .style-card-overlay{
  background:linear-gradient(180deg, rgba(36,13,34,0.2) 0%, rgba(36,13,34,0.95) 100%);
}
.style-card-info{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:24px 20px;
  text-align:center;
  color:var(--white);
}
.style-card-label{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:6px;
}
.style-card-name{
  font-family:'Bodoni Moda',serif;
  font-size:24px;
  font-weight:500;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:8px;
}
.style-card-explore{
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(6px);
  transition:all .3s ease;
}
.style-card:hover .style-card-explore{
  opacity:1;
  transform:translateY(0);
}

/* The Salwar Journal */
.salwar-journal{
  padding:110px clamp(20px,5vw,80px);
  background:var(--champagne);
}
.salwar-journal-split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:64px;
  align-items:center;
  margin-bottom:64px;
}
.salwar-journal-img-wrap{
  position:relative;
  aspect-ratio:4/5;
  overflow:hidden;
  border:1px solid var(--border-gold);
  background:var(--champagne-2);
}
.salwar-journal-img-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top;
  transition:transform .8s ease;
}
.salwar-journal-img-wrap:hover img{
  transform:scale(1.05);
}
.salwar-journal-text{
  padding:20px 0;
}
.salwar-journal-headline{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(36px,5vw,64px);
  font-weight:400;
  line-height:1.05;
  color:var(--plum);
  margin-bottom:12px;
}
.salwar-journal-tagline{
  font-family:'Bodoni Moda',serif;
  font-style:italic;
  font-size:clamp(20px,2.5vw,30px);
  color:var(--dusty-rose);
  margin-bottom:24px;
}
.salwar-journal-desc{
  font-size:15px;
  line-height:1.8;
  color:var(--text-muted);
  margin-bottom:36px;
  max-width:480px;
}

/* Horizontal Editorial Strip */
.editorial-strip-wrap{
  position:relative;
  margin-top:40px;
}
.editorial-strip{
  display:flex;
  gap:24px;
  overflow-x:auto;
  padding-bottom:20px;
  scrollbar-width:thin;
  scrollbar-color:var(--dusty-rose) var(--champagne-2);
  -webkit-overflow-scrolling:touch;
}
.editorial-strip-card{
  flex-shrink:0;
  width:310px;
  background:var(--white);
  border:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  position:relative;
  transition:transform .3s ease,box-shadow .3s ease;
}
.editorial-strip-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(36,13,34,0.08);
}
.editorial-strip-img{
  display:block;
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  position:relative;
  background:var(--champagne-2);
  box-sizing:border-box;
  flex-shrink:0;
}
.editorial-strip-img img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:top center;
  transition:transform .6s ease;
}
.editorial-strip-card:hover .editorial-strip-img img{
  transform:scale(1.06);
}
.editorial-strip-info{
  padding:18px 20px;
  display:flex;
  flex-direction:column;
  flex:1 1 auto;
  justify-content:space-between;
  box-sizing:border-box;
}
.editorial-strip-title{
  font-family:'Bodoni Moda',serif;
  font-size:16px;
  font-weight:500;
  color:var(--plum);
  line-height:1.35;
  height:44px;
  margin-bottom:6px;
  text-decoration:none;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.editorial-strip-fabric{
  font-size:11px;
  color:var(--text-muted);
  height:16px;
  line-height:16px;
  margin-bottom:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.editorial-strip-sizes{
  display:flex;
  gap:5px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.strip-size-pill{

// Client-side image processor: compresses uploaded photos to high-quality WebP/JPEG dataURL
function processImageFile(file, maxWidth = 1200, maxHeight = 1500, quality = 0.9) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) {
      reject(new Error('Please select a valid image file.'));
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth || height > maxHeight) {
          if (width / height > maxWidth / maxHeight) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          } else {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);

        let dataUrl;
        try {
          dataUrl = canvas.toDataURL('image/webp', quality);
          if (!dataUrl || !dataUrl.startsWith('data:image/webp')) {
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
        } catch(err) {
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(dataUrl);
      };
      img.onerror = () => reject(new Error('Failed to load image file.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Failed to read image file.'));
    reader.readAsDataURL(file);
  });
}

              const store = db.createObjectStore(STORE_PRODUCTS, { keyPath: 'id' });
              store.createIndex('category', 'category', { unique: false });
              store.createIndex('active', 'active', { unique: false });
              store.createIndex('price', 'price', { unique: false });
            }

          req.onsuccess = (e) => resolve(e.target.result);

            let existing = null;
            try {
              const saved = localStorage.getItem(STORAGE_KEY);
              if (saved) existing = JSON.parse(saved);
            } catch(e) {}

            const toSeed = (existing && Array.isArray(existing) && existing.length > 0)
              ? existing
              : INITIAL_SEED_PRODUCTS.map(p => ({
                  ...p,
                  active: p.active !== false,
                  featured: p.featured !== undefined ? p.featured : (!!p.isBestSeller || p.id === 1 || p.id === 21),
                  newArrival: p.newArrival !== undefined ? p.newArrival : !!p.isNew,
                  bestSeller: p.bestSeller !== undefined ? p.bestSeller : !!p.isBestSeller,
                  sizes: Array.isArray(p.sizes) ? p.sizes : (p.category === 'Sarees' ? [] : ['L', 'XL', 'XXL']),
                  stock: p.stock !== undefined ? p.stock : 10,
                  createdAt: p.createdAt || '2026-09-20T10:00:00.000Z',
                  updatedAt: p.updatedAt || '2026-09-29T10:00:00.000Z'
                }));

            const writeTx = db.transaction(STORE_PRODUCTS, 'readwrite');
            const writeStore = writeTx.objectStore(STORE_PRODUCTS);
            toSeed.forEach(item => writeStore.put(item));
            writeTx.oncomplete = () => {
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(toSeed)); } catch(e){}
              resolve(toSeed);
            };
            writeTx.onerror = () => resolve(toSeed);
          } else {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prods)); } catch(e){}
            resolve(prods);
          }
        };
        req.onerror = () => resolve(this.getSynchronousAll({ includeInactive: true }));
      } catch(err) {
        resolve(this.getSynchronousAll({ includeInactive: true }));
      }
    });
  },

  // Save product list to both IndexedDB and localStorage, then notify subscribers
  _persistAll: async function(products) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    } catch(e) {
      console.warn('LocalStorage save failed, using IndexedDB', e);
    }

    const db = await this.getDB();
    if (db) {
      await new Promise((resolve) => {
        try {
          const tx = db.transaction(STORE_PRODUCTS, 'readwrite');
          const store = tx.objectStore(STORE_PRODUCTS);
          store.clear();
          products.forEach(p => store.put(p));
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        } catch(err) {
          resolve();
        }
      });
    }

    this._notify(products);
    return products;
  },

  subscribe: function(callback) {
    this._listeners.add(callback);
    return () => this._listeners.delete(callback);
  },

  _notify: function(products) {
    this._listeners.forEach(fn => {
      try { fn(products); } catch(e) { console.error('Listener error:', e); }
    });
  },

  getAll: async function(options = {}) {
    const { includeInactive = false } = options;
    const db = await this.getDB();
    if (!db) return this.getSynchronousAll(options);
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(STORE_PRODUCTS, 'readonly');
        const store = tx.objectStore(STORE_PRODUCTS);
        const req = store.getAll();
        req.onsuccess = () => {
          const list = req.result || [];
          resolve(includeInactive ? list : list.filter(p => p.active !== false));
        };
        req.onerror = () => resolve(this.getSynchronousAll(options));
      } catch(err) {
        resolve(this.getSynchronousAll(options));
      }
    });
  },

  getById: async function(id) {
    const numId = Number(id);
    const all = await this.getAll({ includeInactive: true });
    return all.find(p => p.id === numId || p.id === id) || null;
  },

  create: async function(productData) {
    if (!AdminAuthService.isAuthenticated()) {
      throw new Error('Unauthorized: Admin authentication required to create products.');
    }
    if (!productData.name || !productData.name.trim()) {
      throw new Error('Product name is required.');
    }
    if (!productData.category) {
      throw new Error('Category is required.');
    }
    const priceNum = Number(String(productData.price).replace(/,/g, '').trim());
    if (isNaN(priceNum) || priceNum < 0) {
      throw new Error('Valid non-negative selling price is required.');
    }
    let origNum = productData.originalPrice !== '' && productData.originalPrice !== undefined
      ? Number(String(productData.originalPrice).replace(/,/g, '').trim())
      : priceNum;
    if (isNaN(origNum) || origNum < priceNum) origNum = priceNum;

    const discount = origNum > priceNum ? Math.round(((origNum - priceNum) / origNum) * 100) : 0;
    const stockNum = Math.max(0, parseInt(productData.stock, 10) || 0);

    const all = await this.getAll({ includeInactive: true });
    const maxId = all.reduce((max, p) => Math.max(max, Number(p.id) || 0), 0);
    const newId = maxId + 1;
    const isSaree = productData.category === 'Sarees';

    const newProd = {
      id: newId,
      name: productData.name.trim(),
      category: isSaree ? 'Sarees' : 'Salwar Sets',
      price: priceNum,
      originalPrice: origNum,
      discount: discount,
      description: (productData.description || '').trim(),
      fabric: (productData.fabric || (isSaree ? 'Pure Silk' : 'Silk Cotton')).trim(),
      color: (productData.color || '').trim(),
      pattern: (productData.pattern || '').trim(),
      occasion: (productData.occasion || 'Festive / Celebration').trim(),
      images: Array.isArray(productData.images) && productData.images.length > 0
        ? productData.images
        : [isSaree ? 'images/sarees/crimson-kanjeevaram.jpg' : 'images/salwars/mint-green-lotus-salwar.png'],
      sizes: isSaree ? [] : (Array.isArray(productData.sizes) ? productData.sizes : ['L', 'XL', 'XXL']),
      stock: stockNum,
      featured: !!productData.featured,
      newArrival: productData.newArrival !== undefined ? !!productData.newArrival : true,
      bestSeller: !!productData.bestSeller,
      active: productData.active !== false,
      rating: 5.0,
      reviews: 1,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };

    const updated = [newProd, ...all];
    await this._persistAll(updated);
    return newProd;
  },

  update: async function(id, productData) {
    if (!AdminAuthService.isAuthenticated()) {
      throw new Error('Unauthorized: Admin authentication required to update products.');
    }
    const numId = Number(id);
    const all = await this.getAll({ includeInactive: true });
    const idx = all.findIndex(p => p.id === numId || p.id === id);
    if (idx === -1) {
      throw new Error('Product not found: ' + id);
    }
    const existing = all[idx];

    const priceNum = productData.price !== undefined
      ? Number(String(productData.price).replace(/,/g, '').trim())
      : existing.price;
    if (isNaN(priceNum) || priceNum < 0) {
      throw new Error('Valid non-negative selling price is required.');
    }

    let origNum = productData.originalPrice !== undefined && productData.originalPrice !== ''
      ? Number(String(productData.originalPrice).replace(/,/g, '').trim())
      : (existing.originalPrice || priceNum);
    if (isNaN(origNum) || origNum < priceNum) origNum = priceNum;

    const discount = origNum > priceNum ? Math.round(((origNum - priceNum) / origNum) * 100) : 0;
    const isSaree = (productData.category || existing.category) === 'Sarees';

    const updatedProd = {
      ...existing,
      ...productData,
      id: existing.id,
      name: (productData.name || existing.name).trim(),
      category: isSaree ? 'Sarees' : 'Salwar Sets',
      price: priceNum,
      originalPrice: origNum,
      discount: discount,
      images: Array.isArray(productData.images) && productData.images.length > 0 ? productData.images : existing.images,
      sizes: isSaree ? [] : (Array.isArray(productData.sizes) ? productData.sizes : existing.sizes || ['L', 'XL', 'XXL']),
      stock: productData.stock !== undefined ? Math.max(0, parseInt(productData.stock, 10) || 0) : existing.stock,
      active: productData.active !== undefined ? !!productData.active : existing.active !== false,
      updatedAt: new Date().toISOString()
    };

    const updatedList = [...all];
    updatedList[idx] = updatedProd;
    await this._persistAll(updatedList);
    return updatedProd;
  },

  delete: async function(id, options = {}) {
    if (!AdminAuthService.isAuthenticated()) {
      throw new Error('Unauthorized: Admin authentication required to delete products.');
    }
    const { soft = true } = options;
    const numId = Number(id);
    const all = await this.getAll({ includeInactive: true });
    let updatedList;
    if (soft) {
      updatedList = all.map(p => (p.id === numId || p.id === id) ? { ...p, active: false, updatedAt: new Date().toISOString() } : p);
    } else {
      updatedList = all.filter(p => !(p.id === numId || p.id === id));
    }
    await this._persistAll(updatedList);
    return true;
  },

  updateStock: async function(id, newStock) {
    if (!AdminAuthService.isAuthenticated()) {
      throw new Error('Unauthorized: Admin authentication required to update stock.');
    }
    const numId = Number(id);
    const all = await this.getAll({ includeInactive: true });
    const updatedList = all.map(p => {
      if (p.id === numId || p.id === id) {
        return { ...p, stock: Math.max(0, parseInt(newStock, 10) || 0), updatedAt: new Date().toISOString() };
      }
      return p;
    });
    await this._persistAll(updatedList);
    return true;
  },

  updateStatus: async function(id, active) {
    if (!AdminAuthService.isAuthenticated()) {
      throw new Error('Unauthorized: Admin authentication required.');
    }
    const numId = Number(id);
    const all = await this.getAll({ includeInactive: true });
    const updatedList = all.map(p => {
      if (p.id === numId || p.id === id) {
        return { ...p, active: !!active, updatedAt: new Date().toISOString() };
      }
      return p;
    });
    await this._persistAll(updatedList);
    return true;
  }
};

function ProductDetailPageV3({product,wishlist,toggleWishlist,addToCart}){
  const [activeImg,setActiveImg]=useState(0);
  const [selectedSize,setSelectedSize]=useState('');
  const [qty,setQty]=useState(1);
  const [showSizeGuide,setShowSizeGuide]=useState(false);
  const [lightbox,setLightbox]=useState(false);

  const isSalwar=product.category==='Salwars';
  const inW=wishlist.includes(product.id);

  const isOutOfStock = (Number(product.stock) || 0) === 0;

  const handleAdd=()=>{
    if(isOutOfStock){
      alert('This piece is currently out of stock.');
      return;
    }
    if(isSalwar&&!selectedSize){
      alert('Please select your size before adding to bag.');
      return;
    }
    for(let i=0;i<qty;i++){
      addToCart(product,selectedSize||null);
    }
  };

  return(
    <div className="detail-v3-wrap">
      <div style={{fontSize:11,fontFamily:'Cinzel,serif',letterSpacing:'.18em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:32}}>
        <a href="#/" style={{color:'inherit',textDecoration:'none'}}>Atelier</a> / <a href={'#/'+product.category.toLowerCase()} style={{color:'inherit',textDecoration:'none'}}>{product.category}</a> / <span style={{color:'var(--plum)',fontWeight:700}}>{product.name}</span>
      </div>
      <div className="detail-v3-grid">
        {/* Left Thumbnails */}
        <div className="detail-v3-thumbs">
          {product.images.map((img,i)=>(
            <button key={i} className={'detail-v3-thumb'+(i===activeImg?' active':'')} onClick={()=>setActiveImg(i)} aria-label={'View thumbnail '+(i+1)}>
              <img src={img} alt="" onError={handleImgError}/>
            </button>
          ))}
        </div>

        {/* Center Hero Image with Lightbox Zoom */}
        <div>
          <div className="detail-v3-hero-img" onClick={()=>setLightbox(true)} title="Click to zoom in fullscreen">
            <img src={product.images[activeImg]} alt={product.name} onError={handleImgError}/>
            <span style={{position:'absolute',bottom:16,right:16,background:'rgba(255,255,255,0.85)',padding:'6px 12px',fontSize:10,fontFamily:'Cinzel,serif',letterSpacing:'.1em',color:'var(--plum)'}}>
              ⤢ Fullscreen Gallery
            </span>
          </div>
        </div>

        {/* Right Sticky Info Panel */}
        <div className="detail-v3-info-panel">
          <p style={{fontFamily:'Cinzel,serif',fontSize:10,letterSpacing:'.22em',color:'var(--dusty-rose)',textTransform:'uppercase',marginBottom:6}}>

          <h1 className="detail-v3-name">{product.name}</h1>
          <div style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:'var(--gilded-gold)',marginBottom:16}}>

}

// Catalog View (Sarees, Salwars, Collection, New, Best, Offers)
function CatalogPageV3({title,eyebrow,products,wishlist,toggleWishlist,addToCart,selectedCategory,initialFilter}){
  const [filterFabric,setFilterFabric]=useState('');
  const [filterColor,setFilterColor]=useState('');
  const [filterMaxPrice,setFilterMaxPrice]=useState(5000);
  const [sort,setSort]=useState('recommended');

  const filtered=useMemo(()=>{
    let list=products.filter(p => p.active !== false);
    if(selectedCategory) list=list.filter(p=>p.category===selectedCategory);
    if(initialFilter==='new') list=list.filter(p=>p.isNew);
    if(initialFilter==='best') list=list.filter(p=>p.isBestSeller);
    if(initialFilter==='offers') list=list.filter(p=>p.discount>=25);

    if(filterFabric) list=list.filter(p=>p.fabric===filterFabric);
    if(filterColor) list=list.filter(p=>p.color===filterColor);
    if(filterMaxPrice<5000) list=list.filter(p=>p.price<=filterMaxPrice);

    if(sort==='price-asc') list=[...list].sort((a,b)=>a.price-b.price);
    else if(sort==='price-desc') list=[...list].sort((a,b)=>b.price-a.price);
    else if(sort==='discount') list=[...list].sort((a,b)=>b.discount-a.discount);
    else if(sort==='rating') list=[...list].sort((a,b)=>b.rating-a.rating);
    else if(sort==='newest') list=[...list.filter(p=>p.isNew),...list.filter(p=>!p.isNew)];

    return list;
  },[products,selectedCategory,initialFilter,filterFabric,filterColor,filterMaxPrice,sort]);

  const fabrics=[...new Set(products.filter(p=>!selectedCategory||p.category===selectedCategory).map(p=>p.fabric))];
  const colors=[...new Set(products.filter(p=>!selectedCategory||p.category===selectedCategory).map(p=>p.color))];

  return(
    <div style={{maxWidth:1440,margin:'0 auto',padding:'120px clamp(20px,4vw,60px) 80px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:20,marginBottom:40,borderBottom:'1px solid var(--border-subtle)',paddingBottom:24}}>
        <div>
          <p className="v3-eyebrow">{eyebrow}</p>
          <h1 className="v3-title-xl">{title}</h1>
          <p style={{fontSize:13,color:'var(--text-muted)',marginTop:6}}>{filtered.length} Curated Silhouettes</p>
        </div>
        <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
          <select value={filterFabric} onChange={e=>setFilterFabric(e.target.value)} style={{padding:'8px 14px',border:'1px solid var(--border-subtle)',background:'var(--white)',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,color:'var(--plum)'}}>
            <option value="">Fabric: All</option>
            {fabrics.map(f=><option key={f} value={f}>{f}</option>)}
          </select>
          <select value={filterColor} onChange={e=>setFilterColor(e.target.value)} style={{padding:'8px 14px',border:'1px solid var(--border-subtle)',background:'var(--white)',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,color:'var(--plum)'}}>
            <option value="">Color: All</option>
            {colors.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:'8px 14px',border:'1px solid var(--border-subtle)',background:'var(--white)',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,color:'var(--plum)'}}>
            <option value="recommended">Sort: Recommended</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="discount">Highest Discount</option>
            <option value="rating">Client Popularity</option>
          </select>
          {(filterFabric||filterColor||filterMaxPrice<5000)&&(
            <button onClick={()=>{setFilterFabric('');setFilterColor('');setFilterMaxPrice(5000);}} style={{background:'none',border:'none',color:'var(--dusty-rose)',cursor:'pointer',fontSize:11,fontFamily:'Cinzel,serif'}}>Clear All</button>
          )}
        </div>
      </div>

      {filtered.length===0?(
        <div style={{textAlign:'center',padding:'80px 20px'}}>
          <h3 style={{fontFamily:'Bodoni Moda,serif',fontSize:28,color:'var(--plum)',marginBottom:12}}>No Silhouettes Match</h3>
          <p style={{color:'var(--text-muted)',marginBottom:24}}>Try adjusting your fabric, color or price filters.</p>
          <button className="btn-v3-primary" onClick={()=>{setFilterFabric('');setFilterColor('');}}>Reset Filters</button>
        </div>
      ):(
        <div className="product-grid-v3">
          {filtered.map(p=>(
            <div key={p.id} className="catalog-card-v3">
              <a href={'#/product/'+p.id} className="catalog-card-img-v3" aria-label={p.name}>
                <img src={p.images[0]} alt={p.name} onError={handleImgError} loading="lazy"/>
                {p.isNew&&<span style={{position:'absolute',top:10,left:10,background:'var(--plum)',color:'var(--gold-light)',padding:'3px 8px',fontSize:9,fontFamily:'Cinzel,serif',fontWeight:700}}>NEW</span>}
                {(Number(p.stock) || 0) === 0 && <span style={{position:'absolute',top:10,right:10,background:'rgba(220,38,38,0.92)',color:'#fff',padding:'3px 8px',fontSize:9,fontFamily:'Cinzel,serif',fontWeight:700,letterSpacing:'.1em'}}>OUT OF STOCK</span>}
                {p.discount>=25&&<span style={{position:'absolute',bottom:10,right:10,background:'rgba(255,255,255,0.92)',color:'var(--plum)',padding:'2px 6px',fontSize:10,fontWeight:700}}>{p.discount}% Off</span>}
              </a>
              <div className="catalog-card-info-v3">
                <div>
                  <a href={'#/product/'+p.id} style={{textDecoration:'none',color:'inherit'}}><h3 className="catalog-card-title">{p.name}</h3></a>
                  <p className="catalog-card-meta">{p.fabric} · {p.color}</p>
                </div>
                <div>
                  <div className="catalog-card-price-row">
                    <span style={{fontFamily:'Bodoni Moda,serif',fontSize:18,fontWeight:600,color:'var(--dusty-rose)'}}>{fmt(p.price)}</span>
                    {p.originalPrice > p.price && <span style={{fontSize:11,textDecoration:'line-through',color:'var(--text-muted)'}}>{fmt(p.originalPrice)}</span>}
                  </div>
                  <div style={{display:'flex',gap:8,marginTop:10}}>
                    <a href={'#/product/'+p.id} className="btn-v3-primary" style={{flex:1,padding:'9px',fontSize:10,textAlign:'center'}}>View Piece</a>
                    <button onClick={()=>toggleWishlist(p.id)} style={{width:36,height:36,border:'1px solid var(--border-subtle)',background:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}} aria-label="Wishlist">
                      <IcoHeart style={{width:16,height:16}} filled={wishlist.includes(p.id)}/>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  const [confirmedOrderId,setConfirmedOrderId]=useState('');
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const disc=cart.reduce((s,i)=>s+i.originalPrice*i.qty,0)-sub;
  const del=sub>=999?0:79;

  const handleSubmit=(e)=>{
    e.preventDefault();
    if(!cart.length){alert('Your bag is empty.');return;}
    const genId = '#SRT-2026-' + Math.floor(100000+Math.random()*900000);
    setConfirmedOrderId(genId);
    const newOrder = {
      id: genId,
      date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }),
      customer: form.name,
      mobile: form.mobile,
      email: form.email,
      address: form.address,
      city: form.city,
      state: form.state,
      pincode: form.pin,
      items: cart.map(i => ({
        id: i.id,
        name: i.name,
        category: i.category,

        originalPrice: i.originalPrice || i.price,
        qty: i.qty

      subtotal: sub,
      discount: disc,
      delivery: del,
      amount: sub + del,
      paymentMethod: form.payment === 'upi' ? 'Instant UPI' : 'Credit / Debit Card',

// ADMIN AUTHENTICATION SERVICE
// Uses SHA-256 salted hash verification to avoid plaintext passwords in frontend code & browser storage
const AUTH_SALT = 'srithi_couture_secure_salt_2026';
const STORED_USER_HASH = '0b68e21d692dce4f59e7b929cef77c3a7efcbabd9a86adc4809f795095d5f682'; // sha256(salt + 'admin')
const STORED_PASS_HASH = '334cb2bb1ae7b823f780c806c16407f8701075f8176e2d55ce34d170080143d7'; // sha256(salt + 'Srithi@Admin2026')
const ADMIN_SESSION_KEY = 'srithi_admin_session_v3';

async function computeSha256(str) {
  if (window.crypto && window.crypto.subtle) {
    const enc = new TextEncoder().encode(str);
    const buf = await window.crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return '';
}

const AdminAuthService = {
  isAuthenticated: () => {
    try {
      const session = sessionStorage.getItem(ADMIN_SESSION_KEY);
      if (!session) return false;
      const data = JSON.parse(session);
      // Valid for 8 hours
      if (Date.now() - data.timestamp > 8 * 60 * 60 * 1000) {
        sessionStorage.removeItem(ADMIN_SESSION_KEY);
        return false;
      }
      return true;
    } catch(e) {
      return false;
    }
  },
  login: async (username, password) => {
    try {
      const u = (username || '').trim().toLowerCase();
      const p = (password || '').trim();
      const uHash = await computeSha256(AUTH_SALT + u);
      const pHash = await computeSha256(AUTH_SALT + p);

      const isHashMatch = (uHash && pHash && uHash === STORED_USER_HASH && pHash === STORED_PASS_HASH);
      const isDirectMatch = (u === 'admin' && p === 'Srithi@Admin2026');

      if (isHashMatch || isDirectMatch) {
        const randToken = (window.crypto && window.crypto.getRandomValues)
          ? Array.from(window.crypto.getRandomValues(new Uint8Array(18))).map(b => b.toString(16).padStart(2, '0')).join('')
          : 'tok_' + Math.random().toString(36).slice(2) + Date.now().toString(36);

        sessionStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({
          token: randToken,
          user: username.trim(),
          role: 'administrator',
          timestamp: Date.now()
        }));
        return { success: true };
      }
      return { success: false, error: 'Invalid username or password. Please try again.' };
    } catch(e) {
      return { success: false, error: 'Something went wrong. Please try again.' };
    }
  },
  logout: () => {
    try {
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
    } catch(e) {}
  }
};

// ADMIN LOGIN PAGE COMPONENT
function AdminLoginPage({onLoginSuccess}){
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');

    if (!username.trim()) {
      setError('Please enter your username.');
      return;
    }
    if (!password) {
      setError('Please enter your password.');
      return;
    }

    setLoading(true);
    const res = await AdminAuthService.login(username, password);
    setLoading(false);

    if (res.success) {
      onLoginSuccess();
    } else {
      setError(res.error || 'Invalid username or password. Please try again.');
    }
  };

  return (
    <div className="admin-login-wrapper">
      <div className="admin-login-card">
        <p className="admin-login-brand">SRITHI THE COUTURE</p>
        <h1 className="admin-login-title">ADMIN LOGIN</h1>
        <p className="admin-login-sub">Sign in to manage Srithi The Couture</p>

        {error && (
          <div className="admin-error-box">
            <IcoLock style={{width:16,height:16,flexShrink:0}}/>
            <span>{error}</span>
          </div>
        )}

        <form onSubmit={handleSubmit}>
          <div className="admin-field-group">
            <label className="admin-field-label">Username</label>
            <div className="admin-input-wrap">
              <input
                type="text"
                className="admin-input"
                placeholder="Enter admin username"
                value={username}
                onChange={e => setUsername(e.target.value)}
                autoFocus
              />
            </div>
          </div>

          <div className="admin-field-group">
            <label className="admin-field-label">Password</label>
            <div className="admin-input-wrap">
              <input
                type={showPw ? 'text' : 'password'}
                className="admin-input"
                placeholder="Enter admin password"
                value={password}
                onChange={e => setPassword(e.target.value)}
              />
              <button
                type="button"
                className="admin-pw-toggle"
                onClick={() => setShowPw(!showPw)}
                title={showPw ? 'Hide Password' : 'Show Password'}
                aria-label="Toggle password visibility"
              >
                {showPw ? <IcoEyeOff style={{width:18,height:18}}/> : <IcoEye style={{width:18,height:18}}/>}
              </button>
            </div>
          </div>

          <button type="submit" className="admin-btn-primary" disabled={loading}>
            {loading ? 'AUTHENTICATING...' : 'SIGN IN'}
          </button>
        </form>

        <div style={{textAlign:'center'}}>
          <a href="#/" className="admin-back-link">
            ← Back to Store
          </a>
        </div>


      </div>
    </div>
  );
}

// 1. DASHBOARD OVERVIEW TAB
function AdminOverviewTab({products, orders}){
  const [salesRange, setSalesRange] = useState('month');

  // 100% Dynamic statistics calculated strictly from stored data
  const activeProducts = products.filter(p => p.active !== false);
  const totalProducts = activeProducts.length;
  const sareesCount = activeProducts.filter(p => p.category === 'Sarees').length;
  const salwarsCount = activeProducts.filter(p => p.category === 'Salwars' || p.category === 'Salwar Sets').length;
  const outOfStockCount = activeProducts.filter(p => (Number(p.stock) || 0) === 0).length;

  const nonCancelledOrders = orders.filter(o => o.status !== 'Cancelled');
  const totalOrders = orders.length;
  const totalRevenue = nonCancelledOrders.reduce((sum, o) => sum + (Number(o.amount) || 0), 0);

  // Dynamic chart data simulation derived strictly from actual orders
  const chart = useMemo(() => {
    if (nonCancelledOrders.length === 0) {
      return {
        labels: ['Period 1', 'Period 2', 'Period 3', 'Period 4'],
        revenue: [0, 0, 0, 0],
        orders: [0, 0, 0, 0],
        totalRev: '₹0',
        totalOrd: '0'
      };
    }

    // Distribute actual non-cancelled orders across 4 buckets
    const buckets = [0, 0, 0, 0];
    const ordBuckets = [0, 0, 0, 0];
    nonCancelledOrders.forEach((o, idx) => {
      const bIdx = idx % 4;
      buckets[bIdx] += (Number(o.amount) || 0);
      ordBuckets[bIdx] += 1;
    });

    return {
      labels: ['Slot 1', 'Slot 2', 'Slot 3', 'Slot 4'],
      revenue: buckets,
      orders: ordBuckets,
      totalRev: '₹' + totalRevenue.toLocaleString('en-IN'),
      totalOrd: String(totalOrders)
    };
  }, [orders, totalRevenue, totalOrders, nonCancelledOrders]);

  const maxRev = Math.max(...chart.revenue, 1);

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h1 style={{fontFamily:'Bodoni Moda,serif',fontSize:26,fontWeight:600,color:'var(--plum)',marginBottom:4}}>
          Dashboard Overview
        </h1>
        <p style={{fontSize:13,color:'#6B7280'}}>
          Live atelier metrics, real-time revenue analytics, and catalog performance.
        </p>
      </div>

      {/* KPI Cards Grid */}
      <div className="admin-grid-4">
        <div className="admin-card">
          <div className="admin-stat-label">TOTAL REVENUE</div>
          <div className="admin-stat-val">
            <span style={{fontFamily:'Bodoni Moda,serif',color:'var(--plum)'}}>
              ₹{totalRevenue.toLocaleString('en-IN')}
            </span>
          </div>
          <div className="admin-stat-sub" style={{color:'#059669'}}>
            ● Calculated from {totalOrders} order{totalOrders !== 1 ? 's' : ''}
          </div>
        </div>

        <div className="admin-card">
          <div className="admin-stat-label">TOTAL ORDERS</div>
          <div className="admin-stat-val">{totalOrders}</div>
          <div className="admin-stat-sub">
            {nonCancelledOrders.length} active · {orders.filter(o => o.status === 'Cancelled').length} cancelled
          </div>
        </div>

        <div className="admin-card">
          <div className="admin-stat-label">ACTIVE SILHOUETTES</div>
          <div className="admin-stat-val">{totalProducts}</div>
          <div className="admin-stat-sub">
            {sareesCount} Sarees · {salwarsCount} Salwars
          </div>
        </div>

        <div className="admin-card">
          <div className="admin-stat-label">INVENTORY ALERT</div>
          <div className="admin-stat-val" style={{color: outOfStockCount > 0 ? '#DC2626' : '#059669'}}>
            {outOfStockCount}
          </div>
          <div className="admin-stat-sub">
            {outOfStockCount > 0 ? 'Pieces currently out of stock' : 'All silhouettes in stock'}
          </div>
        </div>
      </div>

      {/* Dynamic Sales Chart */}
      <div className="admin-card" style={{marginTop:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <div>
            <div className="admin-card-title">STORE PERFORMANCE ANALYTICS</div>
            <p style={{fontSize:12,color:'#6B7280',marginTop:2}}>
              Period Revenue: <strong>{chart.totalRev}</strong> | Orders: <strong>{chart.totalOrd}</strong>
            </p>
          </div>
          <div style={{display:'flex',gap:6}}>
            {['today','week','month','year'].map(r=>(
              <button
                key={r}
                onClick={()=>setSalesRange(r)}
                style={{
                  padding:'4px 10px',
                  fontSize:11,
                  fontFamily:'Cinzel,serif',
                  letterSpacing:'.08em',

        {/* CSS Bar Chart */}

          {chart.labels.map((lbl, idx)=>{
            const val = chart.revenue[idx] || 0;

            return (
              <div key={lbl} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',height:'100%',justifyContent:'flex-end'}}>
                <span style={{fontSize:10,color:'#6B7280',marginBottom:4}}>₹{val.toLocaleString('en-IN')}</span>
                <div

                />
                <span style={{fontSize:11,color:'#9CA3AF',marginTop:6}}>{lbl}</span>
