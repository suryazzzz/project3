<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRITHI THE COUTURE — The Signature Edit</title>
  <meta name="description" content="Srithi The Couture — The Signature Edit. An immersive luxury atelier celebrating curated Sarees and bespoke Salwar Sets crafted for the moments that matter." />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel:wght@400;500;600;700&family=Italiana&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
:root{
  --plum:#240D22;
  --plum-dark:#170615;
  --plum-light:#3A1437;
  --plum-rich:#461742;
  --blush:#F6EBEB;
  --blush-accent:#E8C8CB;
  --blush-deep:#D89EA5;
  --champagne:#FAF7F2;
  --champagne-2:#F2ECE2;
  --espresso:#1C1415;
  --dusty-rose:#A65E73;
  --dusty-rose-light:#C48B9F;
  --soft-cream:#FFFDF9;
  --gilded-gold:#C5A880;
  --gold-light:#DFCAAA;
  --text-dark:#201719;
  --text-muted:#766A6E;
  --border-subtle:rgba(36,13,34,0.12);
  --border-gold:rgba(197,168,128,0.35);
  --white:#FFFFFF;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--champagne);
  color:var(--text-dark);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--champagne)}
::-webkit-scrollbar-thumb{background:var(--plum);border-radius:3px}

/* Typography Utility */
.font-editorial{font-family:'Bodoni Moda',serif}
.font-italiana{font-family:'Italiana',serif}
.font-cinzel{font-family:'Cinzel',serif}
.font-sans{font-family:'Plus Jakarta Sans',sans-serif}

/* Top Announcement Strip */
.announcement-v3{
  background:var(--plum-dark);
  color:var(--gold-light);
  text-align:center;
  font-size:10.5px;
  letter-spacing:.22em;
  padding:7px 16px;
  font-family:'Cinzel',serif;
  text-transform:uppercase;
  font-weight:600;
  border-bottom:1px solid rgba(197,168,128,0.2);
}

/* Floating Navigation */
.header-v3{
  position:fixed;
  top:30px;
  left:0;
  right:0;
  z-index:900;
  transition:all .4s cubic-bezier(.16,1,.3,1);
}
.header-v3.scrolled{
  top:0;
  background:rgba(250,247,242,0.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-gold);
  box-shadow:0 8px 30px rgba(36,13,34,0.06);
}
.header-v3-inner{
  max-width:1440px;
  margin:0 auto;
  padding:12px 40px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  transition:padding .3s ease;
}
.header-v3.scrolled .header-v3-inner{
  padding:10px 40px;
}
.header-v3-brand{
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:12px;
}
.header-v3-logo{
  height:36px;
  width:auto;
  filter:brightness(0) invert(1);
  transition:filter .3s ease,transform .2s;
  object-fit:contain;
}
.header-v3.scrolled .header-v3-logo{
  filter:brightness(0);
}
.header-v3-logo-text{
  font-family:'Cinzel',serif;
  font-size:15px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--white);
  font-weight:600;
  transition:color .3s;
  white-space:nowrap;
}
.header-v3.scrolled .header-v3-logo-text{
  color:var(--plum);
}
.header-v3-nav{
  display:flex;
  align-items:center;
  gap:28px;
}
.header-v3-nav a{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-decoration:none;
  color:rgba(255,255,255,0.85);
  font-weight:600;
  transition:color .25s,transform .2s;
  position:relative;
  padding:6px 0;
}
.header-v3.scrolled .header-v3-nav a{
  color:var(--plum);
}
.header-v3-nav a::after{
  content:'';
  position:absolute;
  bottom:0;
  left:50%;
  width:0;
  height:1.5px;
  background:var(--gilded-gold);
  transition:all .25s ease;
  transform:translateX(-50%);
}
.header-v3-nav a:hover{
  color:var(--gold-light);
}
.header-v3.scrolled .header-v3-nav a:hover{
  color:var(--dusty-rose);
}
.header-v3-nav a:hover::after{
  width:100%;
}
.header-v3-actions{
  display:flex;
  align-items:center;
  gap:20px;
  justify-content:flex-end;
}
.header-v3-btn{
  background:none;
  border:none;
  cursor:pointer;
  color:var(--white);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:color .2s,transform .15s;
  text-decoration:none;
}
.header-v3.scrolled .header-v3-btn{
  color:var(--plum);
}
.header-v3-btn:hover{
  color:var(--gold-light);
  transform:translateY(-1px);
}
.header-v3.scrolled .header-v3-btn:hover{
  color:var(--dusty-rose);
}
.v3-badge{
  position:absolute;
  top:-6px;
  right:-8px;
  background:var(--dusty-rose);
  color:var(--white);
  font-size:9px;
  font-weight:700;
  min-width:16px;
  height:16px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
}
.v3-menu-toggle{
  display:none;
  flex-direction:column;
  gap:5px;
  background:none;
  border:none;
  cursor:pointer;
  padding:6px;
}
.v3-menu-toggle span{
  display:block;
  width:24px;
  height:1.5px;
  background:var(--white);
  transition:background .3s;
}
.header-v3.scrolled .v3-menu-toggle span{
  background:var(--plum);
}

/* Fullscreen Immersive Lookbook Hero */
.hero-v3{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--plum-dark);
}
.hero-v3-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 20%;
  filter:brightness(0.78) saturate(1.1);
  transform:scale(1.04);
  animation:heroZoom 14s ease-out forwards;
}
@keyframes heroZoom{
  0%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.hero-v3-overlay{
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center, rgba(36,13,34,0.4) 0%, rgba(23,6,21,0.82) 100%),
             linear-gradient(180deg, rgba(23,6,21,0.45) 0%, rgba(23,6,21,0.2) 50%, rgba(23,6,21,0.88) 100%);
}
.hero-v3-content{
  position:relative;
  z-index:10;
  text-align:center;
  max-width:980px;
  padding:140px 24px 80px;
  color:var(--white);
}
.hero-v3-eyebrow{
  font-family:'Cinzel',serif;
  font-size:clamp(11px,1.4vw,14px);
  letter-spacing:.36em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:20px;
  font-weight:600;
  animation:fadeUp .9s cubic-bezier(.16,1,.3,1) both;
}
.hero-v3-title{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(46px,8.5vw,110px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.02em;
  color:var(--champagne);
  margin-bottom:28px;
  text-transform:uppercase;
  animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .15s both;
}
.hero-v3-title span{
  display:block;
  font-style:italic;
  font-family:'Bodoni Moda',serif;
  color:var(--blush-accent);
  text-transform:none;
}
.hero-v3-sub{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(14px,1.8vw,18px);
  font-weight:300;
  letter-spacing:.08em;
  color:rgba(250,247,242,0.85);
  margin-bottom:44px;
  max-width:540px;
  margin-left:auto;
  margin-right:auto;
  animation:fadeUp 1.1s cubic-bezier(.16,1,.3,1) .3s both;
}
.hero-v3-actions{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  animation:fadeUp 1.2s cubic-bezier(.16,1,.3,1) .45s both;
}
.btn-v3-primary{
  background:var(--gilded-gold);
  color:var(--plum-dark);
  border:1px solid var(--gilded-gold);
  padding:15px 36px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-weight:700;
  text-decoration:none;
  cursor:pointer;
  transition:all .25s ease;
  display:inline-block;
}
.btn-v3-primary:hover{
  background:var(--gold-light);
  border-color:var(--gold-light);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(197,168,128,0.3);
}
.btn-v3-outline{
  background:transparent;
  color:var(--champagne);
  border:1px solid rgba(250,247,242,0.6);
  padding:15px 36px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
  transition:all .25s ease;
  display:inline-block;
}
.btn-v3-outline:hover{
  background:rgba(250,247,242,0.15);
  border-color:var(--champagne);
  transform:translateY(-2px);
}
.hero-v3-scroll{
  position:absolute;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:rgba(250,247,242,0.7);
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.24em;
  text-transform:uppercase;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  animation:floatBounce 2.4s ease-in-out infinite;
}
@keyframes floatBounce{
  0%,100%{transform:translate(-50%,0)}
  50%{transform:translate(-50%,6px)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* Collection Intro / Editorial Statement */
.intro-statement{
  padding:120px 40px;
  max-width:1200px;
  margin:0 auto;
  text-align:center;
}
.intro-statement-eyebrow{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--dusty-rose);
  font-weight:600;
  margin-bottom:24px;
}
.intro-statement-title{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(38px,6vw,84px);
  font-weight:400;
  line-height:.96;
  letter-spacing:-.01em;
  color:var(--plum);
  text-transform:uppercase;
  margin-bottom:32px;
}
.intro-statement-body{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(15px,1.6vw,19px);
  line-height:1.8;
  color:var(--text-muted);
  max-width:680px;
  margin:0 auto 36px;
  font-weight:300;
}
.intro-statement-divider{
  width:60px;
  height:1px;
  background:var(--gilded-gold);
  margin:0 auto;
}

/* Section Common Headers */
.v3-section{
  padding:100px clamp(20px,5vw,80px);
}
.v3-section-head{
  margin-bottom:54px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border-subtle);
  padding-bottom:20px;
}
.v3-eyebrow{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--dusty-rose);
  font-weight:600;
  margin-bottom:10px;
}
.v3-title-xl{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(32px,5vw,68px);
  font-weight:400;
  line-height:1;
  color:var(--plum);
  letter-spacing:-.01em;
}
.v3-link-arrow{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--plum);
  text-decoration:none;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:all .2s;
}
.v3-link-arrow:hover{
  color:var(--dusty-rose);
  transform:translateX(4px);
}

/* Saree Stories - Asymmetric Editorial Lookbook */
.saree-lookbook-grid{
  display:grid;
  grid-template-columns:1.2fr 0.8fr 0.8fr;
  grid-template-rows:auto auto;
  gap:24px;
}
.lookbook-item{
  position:relative;
  overflow:hidden;
  background:var(--champagne-2);
  text-decoration:none;
  display:block;
  cursor:pointer;
  transition:transform .4s ease,box-shadow .4s ease;
}
.lookbook-item.featured{
  grid-row:span 2;
  min-height:680px;
}
.lookbook-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top center;
  transition:transform .75s cubic-bezier(.16,1,.3,1),filter .5s ease;
}
.lookbook-item:hover img{
  transform:scale(1.06);
}
.lookbook-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(23,6,21,0.85) 0%, rgba(23,6,21,0.2) 55%, transparent 100%);
  transition:background .3s;
}
.lookbook-item:hover .lookbook-overlay{
  background:linear-gradient(to top, rgba(23,6,21,0.92) 0%, rgba(23,6,21,0.3) 65%, transparent 100%);
}
.lookbook-content{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:28px 24px;
  color:var(--white);
  z-index:2;
}
.lookbook-tag{
  font-family:'Cinzel',serif;
  font-size:9.5px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:6px;
}
.lookbook-name{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(18px,2vw,28px);
  font-weight:400;
  line-height:1.2;
  margin-bottom:8px;
}
.lookbook-price-row{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:12px;
}
.lookbook-price{
  font-family:'Bodoni Moda',serif;
  font-size:22px;
  font-weight:600;
  color:var(--blush-accent);
}
.lookbook-orig{
  font-size:12px;
  text-decoration:line-through;
  opacity:.7;
}
.lookbook-cta{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--white);
  display:inline-flex;
  align-items:center;
  gap:6px;
  opacity:0;
  transform:translateY(8px);
  transition:all .3s ease;
  font-weight:700;
}
.lookbook-item:hover .lookbook-cta{
  opacity:1;
  transform:translateY(0);
}
.lookbook-wish{
  position:absolute;
  top:16px;
  right:16px;
  z-index:5;
  background:rgba(255,255,255,0.9);
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .2s;
  color:var(--plum);
}
.lookbook-wish:hover,.lookbook-wish.active{
  background:var(--dusty-rose);
  color:var(--white);
}

/* Discover Your Style Section */
.style-section{
  background:var(--blush);
  padding:100px clamp(20px,5vw,80px);
}
.style-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-top:40px;
}
.style-card{
  position:relative;
  aspect-ratio:3/4;
  overflow:hidden;
  text-decoration:none;
  display:block;
  cursor:pointer;
  border:1px solid rgba(197,168,128,0.25);
  background:var(--champagne-2);
}
.style-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top;
  transition:transform .7s ease;
}
.style-card:hover img{
  transform:scale(1.08);
}
.style-card-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(36,13,34,0.1) 0%, rgba(36,13,34,0.85) 100%);
  transition:background .3s;
}
.style-card:hover .style-card-overlay{
  background:linear-gradient(180deg, rgba(36,13,34,0.2) 0%, rgba(36,13,34,0.95) 100%);
}
.style-card-info{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:24px 20px;
  text-align:center;
  color:var(--white);
}
.style-card-label{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold-light);
  margin-bottom:6px;
}
.style-card-name{
  font-family:'Bodoni Moda',serif;
  font-size:24px;
  font-weight:500;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:8px;
}
.style-card-explore{
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(6px);
  transition:all .3s ease;
}
.style-card:hover .style-card-explore{
  opacity:1;
  transform:translateY(0);
}

/* The Salwar Journal */
.salwar-journal{
  padding:110px clamp(20px,5vw,80px);
  background:var(--champagne);
}
.salwar-journal-split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:64px;
  align-items:center;
  margin-bottom:64px;
}
.salwar-journal-img-wrap{
  position:relative;
  aspect-ratio:4/5;
  overflow:hidden;
  border:1px solid var(--border-gold);
  background:var(--champagne-2);
}
.salwar-journal-img-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top;
  transition:transform .8s ease;
}
.salwar-journal-img-wrap:hover img{
  transform:scale(1.05);
}
.salwar-journal-text{
  padding:20px 0;
}
.salwar-journal-headline{
  font-family:'Bodoni Moda',serif;
  font-size:clamp(36px,5vw,64px);
  font-weight:400;
  line-height:1.05;
  color:var(--plum);
  margin-bottom:12px;
}
.salwar-journal-tagline{
  font-family:'Bodoni Moda',serif;
  font-style:italic;
  font-size:clamp(20px,2.5vw,30px);
  color:var(--dusty-rose);
  margin-bottom:24px;
}
.salwar-journal-desc{
  font-size:15px;
  line-height:1.8;
  color:var(--text-muted);
  margin-bottom:36px;
  max-width:480px;
}

/* Horizontal Editorial Strip */
.editorial-strip-wrap{
  position:relative;
  margin-top:40px;
}
.editorial-strip{
  display:flex;
  gap:24px;
  overflow-x:auto;
  padding-bottom:20px;
  scrollbar-width:thin;
  scrollbar-color:var(--dusty-rose) var(--champagne-2);
  -webkit-overflow-scrolling:touch;
}
.editorial-strip-card{
  flex-shrink:0;
  width:310px;
  background:var(--white);
  border:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  position:relative;
  transition:transform .3s ease,box-shadow .3s ease;
}
.editorial-strip-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(36,13,34,0.08);
}
.editorial-strip-img{
  aspect-ratio:3/4;
  overflow:hidden;
  position:relative;
  background:var(--champagne-2);
}
.editorial-strip-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top;
  transition:transform .6s ease;
}
.editorial-strip-card:hover .editorial-strip-img img{
  transform:scale(1.06);
}
.editorial-strip-info{
  padding:20px;
  display:flex;
  flex-direction:column;
  flex:1;
  justify-content:space-between;
}
.editorial-strip-title{
  font-family:'Bodoni Moda',serif;
  font-size:17px;
  font-weight:500;
  color:var(--plum);
  line-height:1.3;
  margin-bottom:6px;
  text-decoration:none;

// Catalog View (Sarees, Salwars, Collection, New, Best, Offers)
function CatalogPageV3({title,eyebrow,products,wishlist,toggleWishlist,addToCart,selectedCategory,initialFilter}){
  const [filterFabric,setFilterFabric]=useState('');
  const [filterColor,setFilterColor]=useState('');
  const [filterMaxPrice,setFilterMaxPrice]=useState(5000);
  const [sort,setSort]=useState('recommended');

  const filtered=useMemo(()=>{
    let list=products;
    if(selectedCategory) list=list.filter(p=>p.category===selectedCategory);
    if(initialFilter==='new') list=list.filter(p=>p.isNew);
    if(initialFilter==='best') list=list.filter(p=>p.isBestSeller);
    if(initialFilter==='offers') list=list.filter(p=>p.discount>=25);

    if(filterFabric) list=list.filter(p=>p.fabric===filterFabric);
    if(filterColor) list=list.filter(p=>p.color===filterColor);
    if(filterMaxPrice<5000) list=list.filter(p=>p.price<=filterMaxPrice);

    if(sort==='price-asc') list=[...list].sort((a,b)=>a.price-b.price);
    else if(sort==='price-desc') list=[...list].sort((a,b)=>b.price-a.price);
    else if(sort==='discount') list=[...list].sort((a,b)=>b.discount-a.discount);
    else if(sort==='rating') list=[...list].sort((a,b)=>b.rating-a.rating);
    else if(sort==='newest') list=[...list.filter(p=>p.isNew),...list.filter(p=>!p.isNew)];

    return list;
  },[products,selectedCategory,initialFilter,filterFabric,filterColor,filterMaxPrice,sort]);

  const fabrics=[...new Set(products.filter(p=>!selectedCategory||p.category===selectedCategory).map(p=>p.fabric))];
  const colors=[...new Set(products.filter(p=>!selectedCategory||p.category===selectedCategory).map(p=>p.color))];

  return(
    <div style={{maxWidth:1440,margin:'0 auto',padding:'120px clamp(20px,4vw,60px) 80px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:20,marginBottom:40,borderBottom:'1px solid var(--border-subtle)',paddingBottom:24}}>
        <div>
          <p className="v3-eyebrow">{eyebrow}</p>
          <h1 className="v3-title-xl">{title}</h1>
          <p style={{fontSize:13,color:'var(--text-muted)',marginTop:6}}>{filtered.length} Curated Silhouettes</p>
        </div>
        <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
          <select value={filterFabric} onChange={e=>setFilterFabric(e.target.value)} style={{padding:'8px 14px',border:'1px solid var(--border-subtle)',background:'var(--white)',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,color:'var(--plum)'}}>
            <option value="">Fabric: All</option>
            {fabrics.map(f=><option key={f} value={f}>{f}</option>)}
          </select>
          <select value={filterColor} onChange={e=>setFilterColor(e.target.value)} style={{padding:'8px 14px',border:'1px solid var(--border-subtle)',background:'var(--white)',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,color:'var(--plum)'}}>
            <option value="">Color: All</option>
            {colors.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:'8px 14px',border:'1px solid var(--border-subtle)',background:'var(--white)',fontFamily:'Plus Jakarta Sans,sans-serif',fontSize:12,color:'var(--plum)'}}>
            <option value="recommended">Sort: Recommended</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="discount">Highest Discount</option>
            <option value="rating">Client Popularity</option>
          </select>
          {(filterFabric||filterColor||filterMaxPrice<5000)&&(
            <button onClick={()=>{setFilterFabric('');setFilterColor('');setFilterMaxPrice(5000);}} style={{background:'none',border:'none',color:'var(--dusty-rose)',cursor:'pointer',fontSize:11,fontFamily:'Cinzel,serif'}}>Clear All</button>
          )}
        </div>
      </div>

      {filtered.length===0?(
        <div style={{textAlign:'center',padding:'80px 20px'}}>
          <h3 style={{fontFamily:'Bodoni Moda,serif',fontSize:28,color:'var(--plum)',marginBottom:12}}>No Silhouettes Match</h3>
          <p style={{color:'var(--text-muted)',marginBottom:24}}>Try adjusting your fabric, color or price filters.</p>
          <button className="btn-v3-primary" onClick={()=>{setFilterFabric('');setFilterColor('');}}>Reset Filters</button>
        </div>
      ):(
        <div className="product-grid-v3">
          {filtered.map(p=>(
            <div key={p.id} className="catalog-card-v3">
              <a href={'#/product/'+p.id} className="catalog-card-img-v3" aria-label={p.name}>
                <img src={p.images[0]} alt={p.name} onError={handleImgError} loading="lazy"/>
                {p.isNew&&<span style={{position:'absolute',top:10,left:10,background:'var(--plum)',color:'var(--gold-light)',padding:'3px 8px',fontSize:9,fontFamily:'Cinzel,serif',fontWeight:700}}>NEW</span>}
                {p.discount>=25&&<span style={{position:'absolute',bottom:10,right:10,background:'rgba(255,255,255,0.92)',color:'var(--plum)',padding:'2px 6px',fontSize:10,fontWeight:700}}>{p.discount}% Off</span>}
              </a>
              <div className="catalog-card-info-v3">
                <div>
                  <a href={'#/product/'+p.id} style={{textDecoration:'none',color:'inherit'}}><h3 style={{fontFamily:'Bodoni Moda,serif',fontSize:17,fontWeight:500,lineHeight:1.3,color:'var(--plum)',marginBottom:4}}>{p.name}</h3></a>

                </div>
                <div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}>
                    <span style={{fontFamily:'Bodoni Moda,serif',fontSize:19,fontWeight:600,color:'var(--dusty-rose)'}}>{fmt(p.price)}</span>
                    <span style={{fontSize:11.5,textDecoration:'line-through',color:'var(--text-muted)'}}>{fmt(p.originalPrice)}</span>
                  </div>
                  <div style={{display:'flex',gap:8}}>
                    <a href={'#/product/'+p.id} className="btn-v3-primary" style={{flex:1,padding:'9px',fontSize:10,textAlign:'center'}}>View Piece</a>
                    <button onClick={()=>toggleWishlist(p.id)} style={{width:36,height:36,border:'1px solid var(--border-subtle)',background:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}} aria-label="Wishlist">
                      <IcoHeart style={{width:16,height:16}} filled={wishlist.includes(p.id)}/>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App(){
  const [cart,setCart]=useState([]);
  const [wishlist,setWishlist]=useState([]);
  const [toasts,setToasts]=useState([]);
  const [page,setPage]=useState(window.location.hash||'#/');
  const [searchOpen,setSearchOpen]=useState(false);
  const [cartOpen,setCartOpen]=useState(false);
  const [searchQuery,setSearchQuery]=useState('');

  useEffect(()=>{
    const h=()=>{
      setPage(window.location.hash||'#/');
      window.scrollTo(0,0);
    };
    window.addEventListener('hashchange',h);
    return()=>window.removeEventListener('hashchange',h);
  },[]);

  const toast=(msg)=>{const id=Date.now();setToasts(t=>[...t,{id,msg}]);};

  const addToCart=useCallback((product,size)=>{
    setCart(c=>{
      const k=product.id+'-'+size;
      const ex=c.find(i=>i.id+'-'+i.size===k);
      if(ex){
        toast('Updated piece in bag');
        return c.map(i=>i.id+'-'+i.size===k?{...i,qty:i.qty+1}:i);
      }
      toast('Added piece to bag');
      return[...c,{...product,size,qty:1}];
    });
    setCartOpen(true);
  },[]);

  const updateQty=useCallback((id,size,qty)=>{
    if(qty<1){
      setCart(c=>c.filter(i=>!(i.id===id&&i.size===size)));
      toast('Removed from bag');
      return;
    }
    setCart(c=>c.map(i=>i.id===id&&i.size===size?{...i,qty}:i));
  },[]);

  const removeFromCart=useCallback((id,size)=>{
    setCart(c=>c.filter(i=>!(i.id===id&&i.size===size)));
    toast('Removed from bag');
  },[]);

  const toggleWishlist=useCallback((id)=>{
    setWishlist(w=>{
      if(w.includes(id)){
        toast('Removed from wishlist');
        return w.filter(x=>x!==id);
      }
      toast('Added to wishlist ♡');
      return[...w,id];
    });
  },[]);

  const hash=page;

                <th style={{padding:'12px 18px',textAlign:'left'}}>Size</th>
                <th style={{padding:'12px 18px',textAlign:'left'}}>Bust</th>
                <th style={{padding:'12px 18px',textAlign:'left'}}>Waist</th>
                <th style={{padding:'12px 18px',textAlign:'left'}}>Hip</th>
              </tr>
            </thead>
            <tbody>
              {[
                ['S','34"','28"','36"'],
                ['M','36"','30"','38"'],
                ['L','38"','32"','40"'],
                ['XL','40"','34"','42"'],
                ['XXL','42"','36"','44"']
              ].map(([s,b,w,h],i)=>(
                <tr key={s} style={{background:i%2===0?'var(--champagne)':'var(--white)',borderBottom:'1px solid var(--border-subtle)'}}>
                  <td style={{padding:'12px 18px',fontWeight:700,color:'var(--dusty-rose)',fontFamily:'Cinzel,serif'}}>{s}</td>
                  <td style={{padding:'12px 18px'}}>{b}</td>
                  <td style={{padding:'12px 18px'}}>{w}</td>
                  <td style={{padding:'12px 18px'}}>{h}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }
    const m=hash.match(/^#/product/(\d+)$/);
    if(m){
      const p=ALL_PRODUCTS.find(x=>x.id===Number(m[1]));
      if(p) return <ProductDetailPageV3 product={p} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart}/>;
    }
    if(hash==='#/search'){
      const q=searchQuery.toLowerCase();
      const res=ALL_PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)||p.fabric.toLowerCase().includes(q)||p.color.toLowerCase().includes(q)||p.category.toLowerCase().includes(q));
      return(
        <div style={{maxWidth:1440,margin:'0 auto',padding:'120px clamp(20px,4vw,60px) 80px'}}>
          <p className="v3-eyebrow">Search Results</p>
          <h1 className="v3-title-xl">"{searchQuery}"</h1>
          <p style={{fontSize:13,color:'var(--text-muted)',marginTop:6,marginBottom:40}}>{res.length} piece{res.length!==1?'s':''} found</p>
          <div className="product-grid-v3">
            {res.map(p=>(
              <div key={p.id} className="catalog-card-v3">
                <a href={'#/product/'+p.id} className="catalog-card-img-v3" aria-label={p.name}>
                  <img src={p.images[0]} alt={p.name} onError={handleImgError} loading="lazy"/>
                </a>
                <div className="catalog-card-info-v3">
                  <div>
                    <a href={'#/product/'+p.id} style={{textDecoration:'none',color:'inherit'}}><h3 style={{fontFamily:'Bodoni Moda,serif',fontSize:17,fontWeight:500,color:'var(--plum)'}}>{p.name}</h3></a>
                    <p style={{fontSize:11.5,color:'var(--text-muted)',marginBottom:10}}>{p.fabric}</p>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <span style={{fontFamily:'Bodoni Moda,serif',fontSize:19,fontWeight:600,color:'var(--dusty-rose)'}}>{fmt(p.price)}</span>
                    <a href={'#/product/'+p.id} className="btn-v3-primary" style={{padding:'8px 14px',fontSize:10}}>View Piece</a>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }
    return(
      <div style={{textAlign:'center',padding:'160px 24px'}}>
        <h2 style={{fontFamily:'Bodoni Moda,serif',fontSize:36,color:'var(--plum)',marginBottom:16}}>Silhouette Not Found</h2>
        <p style={{color:'var(--text-muted)',marginBottom:24}}>The page you requested could not be located in our atelier collection.</p>
        <a href="#/" className="btn-v3-primary">Return to Home</a>
      </div>
    );
  };

  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <FloatingHeader cart={cart} wishlist={wishlist} onSearch={()=>setSearchOpen(true)} onCartOpen={()=>setCartOpen(true)}/>
      <main style={{flex:1}}>{renderContent()}</main>
      <DarkFooter/>
      {searchOpen&&<SearchOverlayV3 onClose={()=>setSearchOpen(false)} onSearch={(q)=>{setSearchQuery(q);window.location.hash='#/search';}}/>}
      {cartOpen&&<ShoppingBagDrawer cart={cart} updateQty={updateQty} removeFromCart={removeFromCart} onClose={()=>setCartOpen(false)}/>}
      <MobileBottomNavV3 page={page} wishlist={wishlist} cart={cart} onCartOpen={()=>setCartOpen(true)}/>
      {toasts.slice(-1).map(t=><Toast key={t.id} message={t.msg} onDone={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))}/>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
